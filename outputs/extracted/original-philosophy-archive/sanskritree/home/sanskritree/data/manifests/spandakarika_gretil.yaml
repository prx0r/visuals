- id: spk.comm.1.1.0
  chapter: '1'
  type: commentary
  transliteration: IAST
  critical_status: gretil_import_commentary
  sanskrit: śam upaśāntāśeṣopatāpaparamānandādvayamayasvacaitanyasphārapratyabhijñāpanasvarūpam
    anugrahaṃ karoti yas tam imaṃ svasvabhāvaṃ śaṃkaraṃ stumas taṃ viśvotkarṣitvena
    parāmṛśantas tatkḷptakalpitapramātṛpadanimajjanena samāviśāmaḥ tatsamāveśa eva
    hi jīvanmuktiphala iha prakaraṇa upadeśyaḥ * bahuvacanam anugrahadṛṣṭikaṭākṣitāśeṣānugrāhyābhedaprathanāya
    * tam ity anena yad asya asāmānyatvam api dhvanitaṃ tat prathayati yasyety ardhena
    * iha parameśvaraḥ prakāśātmā mahādevaḥ śabdarāśiparamārthapūrṇāhantāparāmarśasāratvāt
    sadaivānandaghanasphurattātmakobhayavisargāraṇiparāśaktyātmakapūrṇasvātantryasvarūpas
    tata eva citsvābhāvyād acalasyāpi śrībhagavataḥ svātantryaśaktir avibhaktāpy aśeṣasargasaṃhārādiparamparāṃ
    darpaṇanagaravatsvabhittāv eva bhāviyuktyānadhikām apy adhikām iva darśayantī
    kiṃcic calattātmakadhātvarthānugamāt spanda ity abhihitā tena bhagavān sadāspandatattvasatattvo
    na tv aspandaḥ yad āhuḥ kecit aspandaṃ paraṃ tattvam iti * evaṃ hi śāntasvarūpatvād
    anīśvaram evaitad bhavet * sphurattāsāraspandaśaktimayaśaṃkarātmakasvasvabhāvapratipādanāyaiva
    cedaṃ śāstraṃ samucitaspandābhidhānaṃ mahāgurubhir nibaddham * etac ca vyaktībhaviṣyati
    * sā caiṣā spandaśaktir garbhīkṛtānantasargasaṃhāraikaghanāhantācamatkārānandarūpā
    niḥśeṣaśuddhāśuddharūpāmātṛmeyasaṃkocavikāsābhāsanasatattvā sarvopaniṣadupāsyā
    yugapad evonmeṣanimeṣamayī * tathā hi śivādeḥ kṣityantasyāśeṣasya tattvagrāmasya
    prāksṛṣṭasya saṃhartṛrūpā yā nimeṣabhūr asāv evodbhaviṣyaddaśāpekṣayā sraṣṭurūponmeṣabhūmis
    tathā viśvanimeṣabhūś cidghanatonmeṣasārā cidghanatānimajjanabhūmir api viśvonmeṣarūpā
    yad āgamaḥ / lelihānā sadā devī sadā pūrṇā ca bhāsate ūrmir eṣā vibodhābdheḥ śaktir
    icchātmikā prabhoḥ * iti * śrīmān maheśvaro hi svātantryaśaktyā śivamantramaheśvaramantreśvaramantravijñānākalapralayākalasakalāntāṃ
    pramātṛbhūmikāṃ tadvedyabhūmikāṃ ca gṛhṇānaḥ pūrvapūrvarūpatāṃ bhittibhūtatayā
    sthitām apy antaḥsvarūpāvacchādanakrīḍayā nimeṣayann evonmeṣayati uttararūpatām
    avarohakrameṇa ārohakrameṇa tūttarottararūpatāṃ nimeṣayann eva jñānayoginām unmeṣayati
    pūrvapūrvarūpatām ata evottaram uttaraṃ pūrvatra pūrvatra saṃkocātmatāṃ jahadvikasitatvenāsāv
    ābhāsayati pūrvaṃ pūrvaṃ tu rūpaṃ yathottaraṃ vikasitatāṃ nimajjayan saṅkucitatvena
    darśayati * evaṃ ca sarvaṃ sarvamayam eva prathayati kevalaṃ tadavabhāsitasaṃkocamātrata
    iyaṃ bhedapratipattir iva yad uddalanāyehatya upadeśa ity āstāṃ tāvad etat * nīlasukhādyābhāsonmeṣamayy
    api ca saṃvit pramātrekātmakatatsvarūpanimeṣarūpāvabhātacarapītādyābhāsopasaṃhārarūpā
    ceti svasaṃvedanasiddhām imāṃ yugapad evonmeṣanimeṣobhayarūpāṃ pratibhāṃ bhagavatīṃ
    vicinvan tu mahādhiyaḥ saṃsāravicchedāya * ata evonmeṣanimeṣābhyām ityetatpadaṃ
    nijavṛttau bhaṭṭaśrīkallaṭena saṃkalpamātreṇā ity avibhaktam evecchaśaktirūpatayā
    vyākhyāyi * saṃgrahakṛtāpi ekacintāprasaktasya yataḥ syād aparodayaḥ * unmeṣaḥ
    sa tu vijñeyaḥ svayaṃ tam upalakṣayet * ity atra prārabdhacintāsaṃharaṇam eva
    parasvarūpodayahetur unmeṣa ity abhidhāsyate pravṛttacintāsaṃhāraṃ vinā parasvarūpodayābhāvāt
    * etac ca tatraiva vitaniṣyāmaḥ * parāmṛtarasāpāyas tasya yaḥ pratyayodbhavaḥ
    * tenāsvatantratām eti sa ca tanmātragocaraḥ * ity atrāpy udayaḥ pralayaparamārtha
    iti spaṣṭam eva vakṣyate * yadā kṣobhaḥ pralīyeta tadā syāt paramaṃ padam * ity
    atrāpi kṣobhapralayātmā nimeṣaḥ parapadonmeṣarūpa ity api nirūpayiṣyate * tad
    evam ekaivobhayarūpāpi śaktiḥ kadācid unmeṣapradhānatayā vyavahriyate kadācin
    nimeṣapradhānatayā * tataś ca yasya saṃbandhinyāḥ svarūpanimeṣātmanaḥ kāryonmeṣapradhānāyāḥ
    śakter hetor jagato viśvasya śivāder dharaṇyantasyodayo 'bhedasāratānimajjanasattvo
    nānāvaicitryaśālī bhedarūpaḥ sargaḥ svarūponmeṣātmanaś ca bāhyatānimeṣapradhānāyāḥ
    śakter jagataḥ pralayo 'bhedamayatodayātmā vicitrabhedarūpatāsaṃhāra ita pralayo
    'py udayarūpa udayo 'pi ca pralayarūpa iti vyākhyeyam vastutas tu na kiṃcid udeti
    vyayate vā kevalaṃ spandaśaktir eva bhagavaty akramāpi tathātathābhāsarūpatayā
    sphuranty udetīva vyayata iva ceti darśayiṣyāmaḥ * sthitivilayānu grahāṇāṃ viśiṣṭapralayodayarūpatvān
    nādhikyam iti pralayodayābhyām eva pañcavidhaṃ pārameśvaryaṃ kṛtyaṃ saṃgṛhītam
    * nirṇītaṃ caivaṃprāyaṃ mayaiva prathamasūtramātravivaraṇe spandasaṃdohe * nanu
    śrīmanmahārthadṛṣṭyā sṛṣṭyādidevatābhir eva vicitrā jagataḥ pralayodayāḥ saṃpādyante
    tat katham etad uktaṃ yasyetyādi ityāśaṅkyāha taṃ śakticakravibhavaprabhavām iti
    * śaktīnāṃ sṛṣṭiraktādimarīcīdevīnāṃ cakraṃ dvādaśātmā samūhas tasya yo vibhava
    udyogāvabhāsanacarvaṇavilāpanātmā krīḍāḍambaras tasya prabhavaṃ hetum * etā hi
    devyaḥ śrīmanmanthānabhairavaṃ cakreśvaram āliṅgya sarvadaivajagatsargādikrīḍāṃsaṃpādayantīty
    āmnāyaḥ * atha ca kasmāt parameśvarasya jagatsargasaṃhārādihetutvam ity āśaṅkāyām
    etad evottaraṃ śakticakreti * yāvaddhi kiṃcid viśvaṃ saṃbhavati tatprakāśamānatvena
    prakāśamayatvāt svāminaś cātmasaṃsthasya bhāvajātasya bhāsanam * asty eva na vinā
    tasmād icchāmarśaḥ pravartate * iti vipaścinniścitanītyā parameśvarasyāntaḥprakāśaikātmyena
    prakāśamānaṃ sthitaṃ sacchakticakram ity ucyate yataḥ parameśvarasyāgameṣv anantaśaktitvam
    uddhoṣyate * tasya śakticakrasyābhāsaparamārthasya viśvasya yo vibhavaḥ parasparasaṃyojanāviyojanāvaicitryam
    anantaprakāraṃ tasya prabhavaṃ kāraṇam * sa eva hi bhagavān vijñānadehātmakān
    svātmaikātmyena sthitān viśvān ābhāsān anyonyaṃ nānāvaicitryeṇa saṃyojayan viyojayaṃś
    ca viśvodayapralayahetuḥ * tad uktaṃ śrībhaṭṭakallaṭena vijñānadehātmakasya śakticakraiśvaryasyotpattihetutvam
    * ity etad vṛttyakṣarāṇām atra vyākhyādvaye 'py ānurūpyam * api ca śaktayo 'sya
    jagat kṛtsnam * ity āgamadṛṣṭyā tasmāc chabdārthacintāsu na sāvasthā na yā śivaḥ
    * itīhatyasthityā ca jagadātmanaḥ tatkhecaryūrdhvamārgasthaṃ vyoma vāmeśigocaram
    * iti rahasyanītyā ca vāmeśvarīkhecarīgocarīdikcarībhūcarī rūpasya mayaiva spandasandohe
    samyaṅ nirṇītasya aprabuddhadhiyas tv ete svasthitisthaganodyatāḥ * ity atrāpi
    nirṇeṣyamāṇasyaitadvyākhyādvayavyākhyātaśakticakraprapañcabhūtasya ca yataḥ karaṇavargo
    'yaṃ * iti sthityendriyagrāmātmanaḥ tadākramya balaṃ mantrāḥ * iti nityamantrātmanaḥ
    śabdarāśisamutthasya śaktivargasya * iti nītyā brāhmyādidevatāsvabhāvasyaivam
    āder anantaprakārasyāpi mayaiva spandasandohe vitatya nirṇītasya śakticakrasya
    yo vibhavo māhātmyaṃ tatra prabhavatīti prabhavaṃ svatantraṃ na tu paśuvat paratantram
    * śakticakrasya raśmipuñjasya yo vibhavo 'ntarmukho vikāsas tataḥ prabhava udayo
    'bhivyaktir yasyeti bahuvrīhiṇāntarmukhatatsvarūpanibhālanād ayatnena parameśvarasvarūpapratyabhijñānaṃ
    bhavatīty arthaḥ * kiṃ ca yasya cidānandaghanasyātmana unmeṣanimeṣābhyāṃ svarūponmīlananimīlanābhyāṃ
    yad antas tad bahiḥ iti yuktyā jagataḥ śarīrarūpasya tadanuṣaṅgeṇa bāhyasyāpi
    viśvasya pralayodayau yathāsaṃkhyaṃ majjanonmajjane bhavatas taṃ śakticakravibhavasya
    parasaṃviddevatāsphārasya prabhavaṃ bhaktibhājām etatsvarūpaprakāśakaṃ śaṃkaraṃ
    stumaḥ * tathā yasya svātmanaḥ saṃbandhino bahirmukhatāprasararūpād unmeṣāj jagata
    udayo 'ntarmukhatārūpāc ca nimeṣāt pralayas taṃ viśvasargādikāryunmeṣādisvarūpasaṃviddevīmāhātmyasya
    hetuṃ śaṃkaraṃ stuma iti yathāsaṃbhavam api yojyam * dehādyāviṣṭo 'pi parameśvaraḥ
    karaṇonmīlananimīlanābhyāṃ rūpādipañcakamayasya jagataḥ sargarsaṃhārau karoti
    * yad uktaṃ rahasyatattvavidā tad evaṃ vyavahāre 'pi prabhur dehādim āviśan *
    bhāntam evāntararthaugham icchayā bhāsayed bahiḥ * evaṃvidhārthaparigrahāyāpi
    yasya svātantryaśaktyā iti tyaktvā yasyonmeṣanimeṣābhyām iti nyarūpi guruṇā *
    atra ca śaṃkarastutiḥ samāveśarūpā prāpyatvenābhidheyā śakticakravibhavāt prabhavo
    yasyeti bahuvrīhiṇā śakticakravikāsas tatprāptāv upāya uktaḥ śakticakravibhavasya
    parasaṃviddevatāsphārasya bhaktibhājāṃ prabhavaṃ prakāśakam iti tatpuruṣeṇa phalam
    uktam * yad vakṣyati tataś cakreśvaro bhavet * ity abhidheyopāyayor upāyopeyabhāvaḥ
    saṃbandha ity abhidheyopāya saṃbandhaprayojanāny anenaiva sūtreṇa sūtritāni *
    nanv evaṃbhūtaśaṃkarasvarūpasattāyāṃ kiṃ pramāṇaṃ kutaś copādānādihetuṃ vinā jagad
    asau janayati tasyaivopādānatve mṛtpiṇḍasyeva ghaṭena jagatā tirodhānaṃ kriyeta
    tirohitātirohitatāyāṃ ca bhagavataḥ svabhāvabhedaḥ syāt punar unmajjane ca hetuścintyo
    jagadudayeca dveetaprasaṅga ityetāḥ śaṅkā eka prahāreṇāpahartumāha]
