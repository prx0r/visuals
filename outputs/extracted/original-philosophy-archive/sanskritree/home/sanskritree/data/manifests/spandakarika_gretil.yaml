- id: spk.comm.1.9.7
  chapter: '1'
  type: commentary
  transliteration: IAST
  critical_status: gretil_import_commentary
  sanskrit: nijā svātmīyā svasvātantryollāsitā yeyaṃ svarūpāvimarśasvabhāvā icchāśaktiḥ
    saṃkucitā satyapūrṇaṃmanyatārūpā aśuddhir āṇavaṃ malaṃ tanmalotthitakañcukapañcakāvilatvāt
    jñānaśaktiḥ krameṇa bhedasarvajñatvakiṃcijjñatvāntaḥkaraṇabuddhīndriyatāpattipūrvam
    atyantaṃ saṃkocagrahaṇena bhinnavedyaprathārūpaṃ māyīyaṃ malamaśuddhir eva kriyāśaktiḥ
    krameṇa bhedasarvakartṛtvakiṃcitkartṛtvakarmendriyarūpasaṃkocagrahaṇapūrvam atyantaṃ
    parimitatāṃ prāptā śubhāśubhānuṣṭhānamayaṃ kārmaṃ malam apyaśuddhiḥ tayāsamarthasya
    pūryajñatvakartṛtvavikalpasya tata eva kartavyeṣu laukikaśāstrīyānuṣṭhāneṣv abhilāṣiṇo
    'bhīṣṭānavāpter nityam abhilāṣavyākulasya tata eva kṣaṇam apy alabdhasvarūpaviśrānteḥ
    yadā uktavakṣyamāṇopapattyanubhavāvaṣṭambhato 'bhilāṣavivaśagrāhakābhimānātmā
    kṣobhaḥ pralīyeta anātmany ātmābhimānanivṛttipuraḥsaram ātmany anātmābhimānopaśāntiparyantena
    prakarṣeṇa līyeta tadā paramaṃ spandatattvātmakaṃ padaṃ syād asya pratyabhijñāviṣayatāṃ
    yāyād ityarthaḥ * na tu tadaiva bhavati tasya nityatvāt uktaṃ ca vijñānabhairave
    | mānasaṃ cetanā śaktirātmā ceti catuṣṭayam / yadā priye parikṣīṇaṃ tadā tadbhairavaṃ
    vapuḥ // vspkc_1.9:3 // iti* nijāśuddhiśabdenamalaṃ nāma dravyaṃ pṛthagbhūtam
    astīti ye pratipannāste dūṣyatvena kaṭākṣitāḥ* nanu ca grāhakāhambhāvātmani kṣobhe
    kṣīṇe nistaraṅgajaladhiprakhyam aspandameva tattvaṃ prasaktam ityāśaṅkāṃ śamayati]
