- id: spk.comm.1.19.14
  chapter: '1'
  type: commentary
  transliteration: IAST
  critical_status: gretil_import_commentary
  sanskrit: guṇāḥ sattvarajastamāṃsi yeṣāṃ prakṛtitattvaṃ vibhavabhūte māyātattvāvasthitā
    ihābhipretāḥ yathoktaṃ śrīsvacchande māyāmasūrakavinyāse / adhaśchādanamūrdhvaṃ
    ca raktaṃ śuklaṃ vicintayet / madhye tamo vijānīyādguṇās tv ete vyavasthitāḥ iti
    * ta ādayo yeṣāṃ kalādīnāṃ kṣityantānāṃ spandānāṃ viśeṣaprasarāṇāṃ teṣāṃ ye niḥṣyandāstanukaraṇabhuvanaprasarāḥ
    nīlasukhādisaṃvidaś ca tathā yogyapekṣayā bindunādādayas te satataṃ jñasya suprabuddhasya
    kasyacid evāpaścimajanmano 'paripanthinaḥ svasvabhāvācchādakā na bhavantīti niścayaḥ
    yatas te sāmānyaspandamuktarūpam āśritya yatra sthitam ityatra nirṇītadṛśā labdhātmalābhās
    tata evotpannās tanmayāś cetyarthaḥ tathāhi / svāṅgarūpeṣu bhāveṣu patyurjñānaṃ
    kriyā ca yā / māyātṛtīye ta eva paśoḥ sattvaṃ rajastamaḥ iti śrīpratyabhijñoktadṛśā
    citiśaktireva pārameśvarī jñānakriyāmāyāśaktitritayatayā śrīsadāśivādipade sphuritvā
    saṃkocaprakarṣātsattvarajastamorūpaṃ krīḍāśarīraṃ śrayati yato nijacicchaktisphāramayatvāt
    tadadhiṣṭhitameva sarvadā sarvaṃ jānan suprabuddho guṇādiviśeṣaspandān anucchindann
    api spandatattvāveśamaya eva * yathā tv aprabuddhān badhnanty ete tat pratipādayati]
