- id: spk.comm.1.6.5
  chapter: '1'
  type: commentary
  transliteration: IAST
  critical_status: gretil_import_commentary
  sanskrit: tannirṇītaṃ tattvam ādarāt śraddhayā prayatnena ca / udyamo bhairavaḥ
    / iti śivasūtrapratipāditena sarvabhedopasaṃhārātmanā nijaujovṛttisphāraṇarūpeṇa
    paripūrṇāntarmukhasvarūpasevanātmanā bhairavarūpeṇodyamena parīkṣyam-7:1 yata
    iyamiti sarvasya svasaṃviditā tasya śaṃkarātmanaḥ svasvabhāvasyākṛtrimā sahajā
    spandatattvarūpā svatantratā sarvatra jaḍājaḍaviṣaye sphurantī sthiteti śeṣaḥ
    / kiṃ tat tattvam ityāha yata ityādi labhata ityantam-7:2 ayamiti lokaprasiddho
    golakādirūpo na tu śāstritastasya nityaparokṣatvenāyamiti nirdeśābhāvāt karaṇavargas
    trayodaśendriyāṇi viśeṣeṇa mūḍho māyāvaśāj jaḍābhāsībhūto 'ṇor mūḍhād apyadhikaṃ
    mūḍhatvaṃ prāpto 'mūḍhavac cetanavat svayaṃ pravṛttisthitisaṃhṛtīr labhate viṣayonmukhībhavati
    tatra rajyate tataśca nivartata ityarthaḥ-7:3* kathaṃ sahāntareṇa cakreṇa ihāntaraṃ
    cakraṃ karaṇeśvaryo nāntaḥkaraṇāni teṣāṃ vargaśabdena svīkārāt na vakṣyamāṇaṃ
    puryaṣṭakaṃ tatsthasyāntaḥkaraṇatrayasya vargaśabdenaiva gṛhītatvāt tanmātrāṇāṃ
    ca vāsanāmātrarūpāṇām upadeśyam ayoginaṃ prati sākṣāt pravṛttyādikartṛtvenāsiddheḥ
    yoginastu sākṣāt kṛtatanmātrasya svayameva paratattvapariśīlanāvahitasyopadeśyatvābhāvāt
    tasmād etadekīyamatam asat-7:4* vimūḍho 'mūḍhavad ityanena karaṇavarga eva saṃbandhyo
    natvantaramapi karaṇeśvarīcakraṃ tasya ciccamatkārarūpatvāt-7:5* evam abhidadhānasyāyam
    āśayaḥ yadayaṃ śaṃkarātmā svasvabhāvo 'tidurghaṭakariṇaḥ svātantryād yugapadeva
    saṃvittisāraṃ ca karaṇeśvarīcakraṃ jaḍābhāsarūpaṃ ca karaṇavargam ekatayaiva nirbhāsayan
    pravṛttisthitisaṃhṛtīḥ kārayati yena bhagavatyaḥ karaṇeśvaryo yathā tattadbhāvasṛṣṭyādi
    vidadhati tathā karaṇavargo jaḍo 'pi tatkārīva lakṣyate-7:6* yadyapi rahasyadṛṣṭau
    na kaścij jaḍaḥ karaṇavargo 'sti apitu vijñānadehāḥ karaṇeśvarya eva vijṛmbhante
    tathāpīha suprasiddhapratītyanusāreṇopadeśyaḥ krameṇa rahasyārthopadeśe 'nupraveśya
    ityevam uktam-7:7* evaṃ ca golakādirūpakaraṇavargāpravṛttyādikrameṇa tadadhiṣṭhātṛrūpaṃ
    nijamarīcicakraṃ cinvānenaiva tadubhayapracodakaṃ śrīmacchaṃkarātmakaṃ svasvarūpaṃ
    parīkṣaṇīyaṃ yatas tatprāptau tadīyākṛtrimā svatantratāsya yoginaḥ syād ity apy
    anenaivoktaṃ bhavati-7:8* tadetadeva parīkṣaṇārhaṃ paramopādeyatvād etadeva ca
    parīkṣituṃ śakyamuktayuktyā sukhopāyatvāt ata evādareṇābhilaṣitaviṣayopabhogānirodhātmanā
    bahumānena-7:9* atra parīkṣaṇasyehatyopadeśānusāreṇa prāptakālatā-7:10 yathoktaṃ
    rahasyagurubhiḥ / nijanijeṣu padeṣu patantv imāḥ karaṇavṛttaya ullasitā mama /
    kṣaṇam apīśa manāgapi maiva bhūt tvadvibhedarasakṣatisāhasam-7:11 iti-7:12* parīkṣyam
    ity arhe śakye prāptakālatāyāṃ praiṣādau ca kṛtyaḥ-7:13* atha ca jaḍaḥ karaṇavargo
    yad balād amūḍhavat pravṛttyādi labhate iti sarvasyānubhavasākṣikam abhidadhadindriyādicaitanyavādicārvākamatam
    apyanena vyudastavān-7:14* atha kathamuktaṃ tatas tattvāc cetanatām ivāsādyendriyāṇi
    svayaṃ pravṛttyādi labhanta iti yāvatāyam eva grāhaka icchayā dātrādīnīva karaṇāni
    prerayati-7:15* yad apyuktaṃ tat tattvaṃ prayatnena parīkṣyam iti tadapi kathaṃ
    yato 'smākam icchā bahir evānudhāvati na tu tattvaparīkṣāyāṃ pravartitum utsahata
    ity āśaṅkyāha-7:16]
