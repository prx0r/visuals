- id: spk.comm.1.4.3
  chapter: '1'
  type: commentary
  transliteration: IAST
  critical_status: gretil_import_commentary
  sanskrit: ya evāhaṃ sukhī sa eva duḥkhī sukhānuśāyinā rāgeṇa yuktatvād rakto duḥkhānuśāyinā
    dveṣeṇa sambandhād dviṣṭetyādayaḥ saṃvido jñānāni tā anyatreti avasthātary ātmatattve
    vartante tatraivāntarmukhe viśrāmyanti sphuṭaṃ svasākṣikaṃ kṛtvā * anyathā kṣaṇikajñānānāṃ
    svātmamātrakṣīṇatvāt tatsaṃskārajanmanām api vikalpānāmanubhavāgocare pravṛttyabhāvādanusaṃdhānam
    idaṃ na ghaṭeta * cakārās tulyayogitāparā anusaṃdhānaṃ dyotayanti * kīdṛśe'nyatra
    sukhādyavasthā udayapralayinyo 'nusyūtā dṛbdhā yasmiṃs tasmin sukhādyavasthānusyūte
    'ntaḥsraksūtrakalpatayā sthite * tā ity anenānusaṃdhīyamānāvasthānāṃ smaryamāṇatām
    abhidadhatkṣaṇikajñānavādimate 'nubhavasaṃskārotpannatvād arthākārārūṣitatve 'pi
    smṛteḥ kāmam anubhavasadṛśatvaṃ bhavatu na tv anubhavānubhūtātītakālārthavyavasthāpakatvaṃ
    ghaṭate sarvasaṃvidantarmukhe tu pramātari sati sarvaṃ yujyata iti sūcitavān ity
    alaṃ sukumārahṛdayopadeśyajanavairasyadāyinībhir ābhiḥ kathābhiḥ * etadarthibhiḥ
    pratyabhijñā parīkṣyā * granthakṛtaiva tu yata iha yuktir āsūtritā tato'smābhiḥ
    kiṃcid udghāṭitam iti sacetobhir nāsmabhyam asūyayitavyam * mīmāṃsakaparihārāya
    tu etad itthaṃ vyākhyātavyam * ahaṃ sukhītyādisaṃvido yās tā anyatreti puryaṣṭakasvarūpe
    pramātari sukhādyavasthābhir anusyūte otaprotarūpe sphuṭaṃ lokapratītisākṣikaṃ
    vartante tiṣṭhanti na tv asmadabhyupagate 'smiṃś cidānandaghane śaṃkarātmani svasvabhāve
    iti na sarvadā sukhādyupādhitiraskṛto 'yamātmāpi tu cinmayaḥ * yadā tu nijāśuddhayā
    vakṣyamāṇayāyaṃ svasvarūpaṃ gūhayitvā tiṣṭhati tadā puryaṣṭakādyavasthāyāṃ sukhitvādirūpatāsya
    tatrāpi na nirodhas taiḥ sukhādibhir asyety uktam eveti na tattiraskṛto 'yaṃ kadācidapi
    * ahaṃ kṛśo 'haṃ sthūla ityādipratītiparihāreṇa ahaṃ sukhī duḥkhītyādi vadato
    'yamāśayaḥ sukhitvādipratītisaṃbhinnāṃ puryaṣṭakabhūmim antarmukhe pade nimajjayaṃs
    tadanuṣaṅgeṇa bāhyasyāpi dehaghaṭāder galanāt pratyabhijānāty eva svaṃ śivasvabhāvatvam
    iti sarvathā puryaṣṭakaśamanāyaiva yatna āstheya iti * uktopapattisiddhāṃ samastavādānām
    anupapannatām anuvadann upapattisiddhaṃ spandatattvam evāstīti pratijānāti yuktyanubhavāgamajño
    rahasyagurupravaraḥ]
