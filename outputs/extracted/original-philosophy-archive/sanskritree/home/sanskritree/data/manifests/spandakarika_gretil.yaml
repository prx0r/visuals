- id: spk.comm.1.23.18
  chapter: '1'
  type: commentary
  transliteration: IAST
  critical_status: gretil_import_commentary
  sanskrit: ayaṃ śaṃkarātmā svabhāvo yan mama vakṣyati abhivyaktaṃ sat yac cidānandaghanam
    anubhūtapūrvaṃ svarūpaṃ māṃ vimarśayiṣyati tadavaśyamahaṃ kariṣye bahirmukhatāṃ
    hitvā tatpravaṇa eva bhaviṣyāmi iti saṃkalpya niścitya yām atikrodhādyavasthāsv
    anubhūtacarīṃ cidānandaghanāṃ spandātmikām avasthām avalambya prāpyatvenābhisaṃdhāya
    tiṣṭhati śamitavikalpagatim avikalpām avasthām avicalatvena bhajate yo yogī tadīyāṃ
    tāmavasthāṃ samāśritya candrasūryau apānaḥ prāṇaś cobhāv api hṛdayabhūmau militvā
    yugapadeva sauṣumne'dhvani brahmanāḍyām ūrdhvamārgeṇodānapathenāstamitaḥ śāmyataḥ
    kathaṃ brahmāṇḍalakṣaṇaṃ gocaraṃ hitvā brahmabilādhiṣṭhātṛbrahmādhiṣṭhitamaṇḍaṃ
    muktvā ūrdhvakavāṭāntāṃ dehavyāptiṃ tyaktvā tadā collaṅghitadehavyāptike 'ta eva
    prakarṣeṇa līnāv uktarūpau śaśibhāskarau yatra tasmin mahāvyomni niḥśeṣavedyopaśamarūpe
    paramākāśe prāpte 'pi yaḥ śithilaprayatnatayā khecaryādyātmanā guṇādispandaniḥṣyandena
    vyāmohitatvāt sauṣuptapadavad bhavati sauṣuptena ca suptamapy upalakṣitaṃ tena
    ca svapnasuṣuptavat yaḥ śūnyādibhūmim evādhitiṣṭhati sa yogī samyaganabhivyaktasvasvabhāvo
    mūḍha ity ucyate-35:1 yathoktaṃ śrībhaṭṭakallaṭena / yāṃ spandātmikām avasthām
    avalambya / iti yoginaḥ-35:2 iti ca / yasya svasvabhāvābhivyaktir na samyak vṛttā
    sa svapnādinā muhyamāno 'prabuddho niruddhaḥ syāt / iti-35:3 yastu tatrāpi prayatnapāṭavād
    udyantṛtābalāt kṣaṇamapi na śithilībhavati sa tamasānabhibhūtatvāt cidākāśamayatvenaivāvasthitaḥ
    prabuddha ucyate ata eva satatodyogavataiva yoginā bhavitavyam ityādiṣṭaṃ gurubhiḥ
    iti śivam-35:4]
