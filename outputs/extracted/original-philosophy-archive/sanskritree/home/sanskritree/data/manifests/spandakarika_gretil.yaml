- id: spk.comm.1.10.8
  chapter: '1'
  type: commentary
  transliteration: IAST
  critical_status: gretil_import_commentary
  sanskrit: tadetyupadeśyāpekṣayā akṛtrimaḥ sahajo dharmaḥ prāṅ nirdiṣṭasvatantratārūpaḥ
    parameśvarasvabhāvo jñatvakartṛtve sāmarasyāvasthitaprakāśānandātmanī jñānakriye
    lakṣaṇamavyabhicāri svarūpaṃ yasya tādṛk tadā kṣobhopaśame 'sya puruṣasya syād
    abhivyajyata ityarthaḥ * kuta etad abhivyajyata ityāha yatastadā paramapadapraveśasamaye
    sarvam īpsitamiti yadyaj jijñāsitaṃ cikīrṣitaṃ vāsya tat pravivikṣāyām abhūt tattaj
    jānāti ca karoti ca * cakārāv atra yaugapadyam āhatuḥ na tu yathaike cakārābhyāṃ
    jñānakriyayor aikātmyaṃ sūcayatīti taddhi jñatvakartṛtvalakṣaṇa ity anenaivaikadharmaviśeṣaṇena
    sambandhinirdeśena vāstavasvarūpābhidhāyinoktam * atha yataḥ karaṇeti nijāśuddhīti
    sūtrapratipāditonmeṣakramasamādhānasākṣātkṛtasya spandatattvasya dṛḍhāvaṣṭambhād
    vyutthānamapi samādhyekarasaṃ kurvato bhavocchedo bhavatītyāha]
