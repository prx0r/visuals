- id: spk.comm.1.2.1
  chapter: '1'
  type: commentary
  transliteration: IAST
  critical_status: gretil_import_commentary
  sanskrit: tasyāsya śaṃkarātmanaḥ prakāśānandaghanasya svasvabhāvasya na kutraciddeśe
    kāla ākāre vā nirodhaḥ prasaravyāghāto 'sti anāvṛtarūpatvād asthagitasvabhāvatvāt
    * ayaṃ bhāvaḥ iha yatkiṃcitprāṇapuryaṣṭakasukhanīlādikaṃ citprakāśasyāvarakaṃ
    saṃbhāvyate tadyadi na prakāśate na kiṃcit prakāśamānaṃ tu prakāśātmakaśaṃkarasvarūpameveti
    kiṃ kasya nirodhakaṃ ko vā nirodhārthaḥ * etadeva tasyetyetadviśeṣaṇena yatretyādinopapādayati
    * yatra yasmiṃścid rūpe svātmani idaṃ mātṛmānameyātmakaṃ sarvaṃ jagatkāryaṃ sthitaṃ
    yatprakāśena prakāśamānaṃ satsthitiṃ labhate tasya kathaṃ tena nirodhaḥ śakyas
    tannirodhe hi nirodhakābhimatameva na cakāsyādity āśayaśeṣaḥ yathoktam / tadātmanaiva
    tasya syātkathaṃ prāṇena yantraṇā ityajaḍapramātṛsiddhau * nanūtpannasya sthityātmā
    prakāśe bhavati utpattireva tv asya kuta ityāha yasmāc ca nirgatamiti * smṛtisvapnasaṃkalpayoginirmāṇadṛṣṭayā
    citaḥ svānubhavasiddhaṃ jagatkāraṇatvam ujjhitvā apramāṇakam anupapannaṃ ca pradhānaparamāṇvādīnāṃ
    na tatkalpayituṃ yujyate * kāryapadena cedameva dhvanitaṃ kartuḥ kriyayā niṣpādyaṃ
    hi kāryamucyate na tu jaḍakāraṇānantarabhāvi jaḍasya kāraṇatvānupapatteḥ īśvarapratyabhijñoktanītyā
    * bhaviṣyati caitat * avasthāyugalaṃ cātra kāryakartṛtvaśabditam ityatra / sarvaśabdenopādānādinairapekṣyaṃ
    karturdhvanitam na ca kāryaṃ ghaṭādi kartuḥ kumbhakārādeḥ kadācitsvarūpaṃ tirodadhad
    dṛṣṭam * nanu nirgatir avasthitasya bhavati tatkimetat kvacid ādāv eva sthitaṃ
    nānyatra sthitamapitu tatraiva cidātmanītyāha yatra sthitamiti * āvṛttyā caitadyojyam
    * ayamarthaḥ yadi cidātmani jagadahaṃprakāśābhedena na bhavet tat katham upādānādinirapekṣaṃ
    tata udiyāt yatastu yathā nyagrodhabījasthaḥ śaktirūpo mahādrumaḥ / tathā hṛdayabījasthaṃ
    jagad etac carācaram ityāmnāyasthityā * svāminaścātmasaṃsthasya * iti pūrvoktayuktyā
    ca tatraitad abhedena sphuratsthitaṃ tato 'yaṃ cidātmā bhagavānnijarasāśyānatārūpaṃ
    jagad unmajjayatīti yujyate * evaṃ ca yatra sthitameva sad yasmān nirgatamityatra
    yojanā jātā * ca evārthe bhinnakramaḥ * nanu yadi tasmāt prakāśavapuṣa idaṃ jagan
    niryātaṃ tan na pratheta na hi prathābāhyaṃ ca prathate ceti yuktam ityāśaṅkya
    yasmān nirgatamapi sadyatra sthitam ity āvṛttyā saṃgamanīyam * co 'pyarthe bhinnakramaḥ
    * etaduktaṃ bhavati na prasevakādivākṣoṭādi tat tasmān nirgatamapi tu sa eva bhagavān
    svasvātantryād anatiriktām apyatiriktāmiva jagadrūpatāṃ svabhittau darpaṇanagaravat
    prakāśayan sthitaḥ * nanu ca bhavatvevaṃ sargasthityavasthayor jagatāsyāniruddhatvaṃ
    saṃhārāvasthayā tv abhāvātmanā suṣuptadeśīyayā jagataḥ sambandhinyā kathaṃ naitat
    tirodhīyate nahi grāhyaṃ jagadvinā grāhakaścidātmā kaścidity āvṛttyaitad evottaraṃ
    yasmān nirgatamapi sadyatraiva sthitamutpannam api jagatsaṃhārāvasthāyāṃ tadaikātmyenaivāste
    na tv asyānyaḥ kaściducchedaḥ śūnyarūpastasya vakṣyamāṇayuktyā prakāśaṃ bhittibhūtaṃ
    vinānupapatterityarthaḥ yathoktaṃ śrīsvacchandaśāstre / aśūnyaṃ śūnyamityuktaṃ
    śūnyaṃ cābhāva ucyate / devyabhāvaḥ sa vijñeyo yatra bhāvāḥ kṣayaṃ gatāḥ iti *
    evaṃ sarvaṃ yasya kāryaṃ yatprakāśenaiva prakāśate saṃhṛtamapi ca sadyatprakāśaikātmyena
    tiṣṭhati na tasya deśakālākārādi kiṃcin nirodhakaṃ yujyate iti vyāpakaṃ nityaṃ
    viśvaśaktikhacitaṃ svaprakāśamādisiddhaṃ caitattattvamiti nāsya siddhāv ajñātārthaprakāśarūpaṃ
    pramāṇavarākamupapadyata upayujyate sambhavati vā pratyutaitattattvasiddhyadhīnā
    pramāṇādiviśvavastusiddhiḥ taduktamasmadgurubhis tantrāloke / pramāṇānyapi vastūnāṃ
    jīvitaṃ yāni tanvate / teṣāmapi paro jīvaḥ sa eva parameśvaraḥ iti * yasmān nirgatamapīdaṃ
    jagadyatra sthitaṃ yatprakāśena prakāśamānaṃ tathābhūtamapi yatra sthitaṃ yatprakāśaikarūpaṃ
    yatprakāśa eva yasya siddhyai nyakṣeṇekṣyamāṇaṃ bhavati na tv anyaj jagan nāma
    kiṃcit * atra yatra sthitamityāvartya dvir yojyam * evaṃ ca svānubhavasiddhamevāsya
    tattvasya sṛṣṭisthitisaṃhāramelanāvabhāsino 'tidurghaṭakāriṇaḥ sarvadā sarvatrāniruddhatvam
    yathoktaṃ śrīmadutpaladevācāryaiḥ / parameśvaratā jayatyapūrvā tava sarveśa yadīśitavyaśūnyā
    / aparāpi tathaiva te yayedaṃ jagadābhāti yathā tathā na bhāti iti * atrahibhāsamānameva
    jagad bhāsanaikaśeṣībhūtatvād bhāsanātiriktaṃ na kiṃcidbhātītyarthaḥ * kiṃca yatra
    sthitam ityuktyopaśamapade yasmāc ca nirgatamiti prasarapade yato'sya na nirodhas
    tato nimīlanonmīlanasamādhidvaye'pi yoginā svasvabhāvasamāveśapareṇaiva bhavitavyam
    yadvakṣyate / yadā kṣobhaḥ pralīyeta tadā syātparamaṃ padam iti tathā / tasmāc
    chabdārthacintāsu na sāvasthā na yā śivaḥ ityapi ca * kutracidanātmavādini saugatādau
    pramātari kutracic ca bādhakābhimate pramāṇe sati na tasya nirodhaḥ pratiṣedho'sti
    yato yastasya pratiṣedhako yac ca tasya pratiṣedhakaṃ pramāṇaṃ tadyadi na siddham
    abhittikam etac citraṃ siddhiścāsya prakāśate iti tatsiddhyaiva bhagavānādisiddhasvaprakāśamūrtir
    astīty etat pratiṣedhāyoditenāpy anakṣaramuktam bhaviṣyati caitat / na tu yo 'ntarmukho
    bhāvaḥ ityatrāntare * evaṃ cānena viśvottīrṇaṃ viśvamayaṃ viśvasargasaṃhārādikāri
    śāṃkaraṃ svasvabhāvātmakaṃ tattvam ityabhidadhatā sarveṣu pārameśvareṣu yadupāsyaṃ
    taditaḥ spandatattvān nādhikaṃ kevalametatsvātantryavaśenaiva tadupāsāvaicitryam
    ābhāsyate * vastutastu etadvīryasāram evāśeṣam yadvakṣyati / tadākramya balaṃ
    mantrāḥ sarvajñabalaśālinaḥ ityetadapi bhaṅgyā pratipāditam * evaṃ ca na kaścid
    uktacodyāvakāśaḥ * evametādṛśeṣu cintāratnaprāyeṣu śrīspandasūtreṣu yadanyaiḥ
    sarvair vivṛtikṛdbhir vyākhyāyi yac cāsmābhiḥ kiṃcid vyākriyate tatrāntaramamatsarā
    anavaliptāś ca svayameva vicinvantu sacetaso na tu tad asmābhir udghāṭya pratipadaṃ
    pradarśyate granthagauravāpatteḥ * nanu jāgarādidaśasv īdṛśaḥ svabhāvo nānubhūyate
    yadi cāyamuktayuktibhirna kenacit nirudhyate tat jāgarādyavasthā svayameva nirotsyate
    iti śaṅkāta uktamapyartham apratipadyamānaṃ pratibodhayann upadiśati]
