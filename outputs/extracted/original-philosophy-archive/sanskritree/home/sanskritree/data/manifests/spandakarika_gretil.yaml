- id: spk.comm.1.5.4
  chapter: '1'
  type: commentary
  transliteration: IAST
  critical_status: gretil_import_commentary
  sanskrit: iha yatkiṃcidduḥkhasukhādyāntaraṃ nīlapītādikaṃ bāhyaṃ grāhyaṃ yac caitad
    grāhakaṃ puryaṣṭakaśarīrendriyādi tattāvatsauṣuptavad asaṃcetyamānaṃ sphuṭameva
    nāstīti vaktuṃ śakyam * yadāpi tu saṃcetyate tadā saṃcetyamānasyāpy asya caitanyamayatvāc
    caitanyam evāstīty āyātam yadāhuḥ / prakāśātmā prakāśyo 'rthe nāprakāśaś ca sidhyati
    iti rahasyatattvavido'smatparameṣṭhinaḥ śrīmadutpaladevapādāḥ śrīmadīśvarapratyabhijñāyām
    ihāpi vakṣyate / tatsaṃvedanarūpeṇa tādātmyapratipattitaḥ ityato duḥkhasukhādi
    nīlādi tadgrāhakaṃ ca yatra nāsti tatprakāśaikaghanaṃ tattvamasti * nanvevaṃ sarvagrāhyagrāhakocchede
    śūnyātmaiva tattvamityāyātaṃ netyāha na cāsti mūḍhabhāvo 'pi iti * mūḍhabhāvo
    mūḍhatvaṃ śūnyarūpatāpi yatra nāsti so 'pi hi na prathate kathamasti prathate
    cet tarhi prathātmakatvān nāsau kaścit prathaivāsti na ca prathāyāḥ kadācidbhāvo
    bhavati tadabhāve prathābhāvasyāpyasiddheḥ bhaviṣyati caitat / na tu yo 'ntarmukho
    bhāvaḥ ityatra * api ca mūḍhabhāva aiśvaryātmakavimarśaśūnyaprakāśamātratattvo
    brahmarūpo 'pi yatra nāsti yac chrutyantavidaḥ pratipannāḥ vijñānaṃ brahma iti
    tasyāpi svātantryātmakaspandaśaktiṃ vinā jaḍatvāt yathoktaṃ pratyabhijñāyām /
    svabhāvamavabhāsasya vimarśaṃ vidur anyathā / prakāśo 'rthoparakto'pi sphaṭikādijaḍopamaḥ
    iti bhaṭṭanāyakastotre 'pi / napuṃsakamidaṃ nātha paraṃ brahma phalet kiyat /
    tvatpauruṣī niyoktrī cen na syāttvadbhaktisundarī iti evaṃ ca yatra sthitam ityataḥ
    prabhṛti yattattvaṃ vicāritaṃ tadevāsti tac cāstyeva paramārthato yuktyanubhavāgamasiddhena
    rūpeṇa paramārthata eva cākalpitena pūrṇena rūpeṇāsti na tu nīlādivat kalpitena
    / yathoktaṃ mahāgurubhiḥ / evamātmanyasatkalpāḥ prakāśasyaiva santy amī / jaḍāḥ
    prakāśa evāsti svātmanaḥ svaparātmabhiḥ iti tatrabhavadbhartṛhariṇāpi / yadādau
    ca yadante ca yanmadhye tasya satyatā / na yad ābhāsate tasya satyatvaṃ tāvadeva
    hi iti sāvadhāraṇatvāt sarvavākyānām evakāro 'tra trir yojyaḥ / evamanena sūtreṇa
    sukhādyākārasaṃvitsaṃtānavādināṃ sukhādikaluṣitapramātṛtattvavādināṃ grāhyagrāhakanānātvavādināṃ
    sarveṣām abhāvavādināṃ niṣparāmarśaprakāśabrahmavādināṃ ca matam anupapannatvād
    asattvenānūdya pāramārthikaṃ spandaśaktirūpameva tattvam astīti pratijñātam atha
    ca yasminn asmin sopadeśasāvadhānamahānubhāvapariśīlye sphurattāsāre spandatattve
    sphurati duḥkhasukhagrāhyagrāhakatadabhāvādikam idaṃ sad api na kiṃcid eva sarvasyaitac
    camatkāraikasāratvāt tad evaitad astīty upadiṣṭam / yanmahāguravaḥ / duḥkhānyapi
    sukhāyante viṣam apy amṛtāyate / mokṣāyate ca saṃsāro yatra mārgaḥ sa śāṃkaraḥ
    iti * śāṃkaro mārgaḥ śaṃkarātmasvabhāvaprāptihetuḥ parāśaktirūpaḥ prasaraḥ * evam
    upapattiparighaṭitatattvapratyabhijñānāya sābhijñānam upāyaṃ nirūpayati]
