- id: spk.comm.1.8.6
  chapter: '1'
  type: commentary
  transliteration: IAST
  critical_status: gretil_import_commentary
  sanskrit: ayaṃ laukikaḥ puruṣa icchaiva nodanaṃ pratodastasya prerakatvena karaṇapravartanārthavyāpāraṇāya
    yasmān na pravartate api tu ātmanaś cidrūpasya yad balaṃ spandatattvātmakaṃ tatsparśāt
    tatkṛtāt kiyanmātrād āveśāt tatsamo bhavet ahaṃtārasavipruḍabhiṣekādacetano 'pi
    cetanatām āsādayatyeva * tatas tat tattvaṃ na kevalaṃ karaṇāni yāvat tatprerakatvena
    śaṅkitaṃ kalpitamapi pramātāraṃ cetanīkṛtya svayaṃ pravṛttyādipātraṃ karoti yenāsyāyam
    abhimāno 'haṃ karaṇāni prerayāmīti * spandatattvānuvedhaṃ vināpi tu sa eva na
    kiṃciditi karaṇānāṃ grāhakasya ca svaraśmicakraprasarānuvedhena cetanībhāvāpādakaṃ
    tattvaṃ parīkṣyamiti yuktameva * yadi punar icchākhyena pratodarūpeṇa karaṇāntareṇa
    karaṇāni prerayet tad apīcchākhyaṃ karaṇaṃ preryatvāt karaṇāntaraṃ svapreraṇāyāpekṣeta
    tadapy anyad ity anavasthā syāt * yat tūktam asmākamicchā na tatra pravartitum
    utsahate iti tatrāpyādyaṃ ślokārdham abhyupagamena paraṃ tūttaratayā yojyam *
    satyaṃ nāyaṃ puruṣastattvaparīkṣārtham icchāṃ pravartayituṃ śaknoti necchayā tattvaṃ
    viṣayīkartuṃ kṣamas tasyāvikalpyatvād api tu viṣayān anudhāvantīm icchāṃ tadupabhogapuraḥsaraṃ
    praśamayya yadā tv antarmukhamātmabalaṃ spandatattvaṃ svakaraṇānāṃ ca cetanāvahaṃ
    spṛśati tadā tatsamo bhavet tatsamāveśāt tadvat sarvatra svatantratām āsādayatyeva
    yasmād evaṃ tasmāt tattvaṃ parīkṣyam ityarthaḥ * śaktibhūmeḥ sparśāpradhānatvād
    ātmabalasparśādity uktam * nanu cāyaṃ kṣetrī parameśvaramayo 'pi kiṃ na sadā pāripūrṇyena
    sphurati kasmād antarmukhātmabalasparśam apekṣata ity āśaṅkyāha]
