- id: spk.comm.1.14.11
  chapter: '1'
  type: commentary
  transliteration: IAST
  critical_status: gretil_import_commentary
  sanskrit: atra spandatattve kāryatvaṃ kartṛtvamiti ca śabditaṃ śabdavyavahāramātreṇa
    bheditamavasthāyugalamasti vastuto hi tadekameva svatantraprakāśaghanaśaṃkararūpaṃ
    tattvaṃ kartṛsattvāvyatiriktayā prakāśātmanā kriyayā vyāptaṃ tadabhedena prakāśamānaṃ
    tattvabhuvanaśarīratadabhāvādirūpatvaṃ svīkurvatkāryam ityucyate tadanyasya kasyāpi
    kāraṇatvāyogāt-16:1 yathoktaṃ śrīpratyabhijñāyām / jaḍasya tu na sā śaktiḥ sattā
    yadasataḥ sataḥ / kartṛkarmatvatattvaiva kāryakāraṇatā tataḥ-16:2 iti-16:3 * tasya
    cedameva kāryatvaṃ yadayaṃ vicitradeśakālādyābhāsasaṃyojanaviyojanakrameṇānantān
    dehanīlādyābhāsāṃś cidātmanaḥ svarūpād anatiriktān api mukurapratibimbavad atiriktān
    ivābhāsayati yāvac ca kiṃcidābhāsayati tat sarvam ābhāsyamānatvādeva bahirmukhena
    rūpeṇa kṣayadharmakaṃ kṣayaś cāsyedaṃtābhāsanimajjanenāhaṃtārūpatayāvasthānam
    ata eva dehādergrāhakasya yo vedyāṃśaḥ sa eva bhagavatā sṛjyate saṃhriyate ca
    na tv ahaṃtāprakāśātmakaṃ kartṛrūpaṃ tasya dehādyāveśe 'pi bhagavadekarūpatvāt
    atastatra tayoḥ kāryakartṛtvayor madhyāt kāryatā kṣayiṇī kartṛtvaṃ citsvātantryarūpaṃ
    punarakṣayaṃ jagadudayāpāyayor api tasya svabhāvād acalanāt-16:4 * calane tu jagadudayāpāyāv
    api na kaucic cakāsyātām iti mūḍhādyavasthāyām apy akhaṇḍitacamatkārasāram amūḍham
    evaitat-16:5 * nanv abhāvasamādhānaniṣpattau suṣuptādau cāsya kartṛtvaṃ nopalabhāmahe
    kvacidapi pravṛttyadarśanāt-16:6 * satyaṃ kāryonmukha indriyādipreraṇātmakavyāpārapravaṇo
    yaḥ prayatnaḥ saṃrambhaḥ so 'tra kāryakṣayapade lupyate vicchidyate tasmiṃl lupte
    sati abudho 'bhāvasamādhyapahāritātmarūpo mūḍho vilupto 'smīti manyate-16:7 *
    yaḥ punarantarmukho 'haṃtāprakāśarūpaḥ svabhāvo 'ta eva sarvajñatvaguṇasyāspadam
    upalakṣaṇaṃ caitat sarvakartṛtvāder api tasya lopo na kadācit syād bhavatīti na
    kadācidapi saṃbhāvanīyo 'nyasya tallopam upalabdhuḥ kasyāpy anupalambhāt yadi
    sa kaścid upalabhyate sa evāsāv antarmukhaś cidrūpo na ced upalabhyate tarhi sā
    lopadaśāstīti kuto niścayaḥ-16:8 atha cānyaḥ kaścit tallopaṃ nopalabhate 'pitu
    sa eva prakāśātmā tatkathaṃ tasyābhāvaḥ / evaṃ cānyasyānupalambhanād ity atrānyakartṛkasyopalambhasyābhāvād
    ityarthaḥ-16:9 atha ca ghaṭābhāvo yathā ghaṭaviviktabhūtalādyupalambhanān niścīyate
    tathaivātmābhāvo 'pyātmaviviktasya kasyacid upalambhān niścīyeta tadupalambhakasattāvaśyambhāvinīti
    tadupalambhakasvātmanāstitā na sidhyati-16:10 * yadi ca kāryonmukhaprayatnalope
    sa lupyeta tadottarakālam anyasya kasyāpyupalambho na bhavet anyopalambhābhāvaḥ
    prasajyetety arthaḥ-16:11 * api cānyasya bahirmukhasya prayatnasya sauṣuptādāv
    anupalambhāt katham antarmukhasya tattvasya bāliśair lopa āśaṅkito yato 'nyasya
    lope 'nyasya kiṃ vṛttam-16:12 * atha cānyasya kāryonmukhaprayatnasyānupalambhād
    anupalambhaprakāśanān na kadācit prakāśātmano 'ntarmukhasya tasyopalabdhur lopaḥ
    yato 'sāv antarmukhobhāvaḥ sarvajñatvaguṇasyāspadaṃ tām apyabhāvadaśāṃ vettyeva
    anyathā saiva na sidhyediti-16:13 * anyasyeti kartari karmaṇi ca ṣaṣṭhī-16:14
    * antarmukhe kāryatvapratiyogitām iva kartṛtvasya sambhāvyāvasthātvam uktaṃ vastutastu
    uktayuktyā tasyāvasthātṛtvam eva-16:15 * antarmukha iti antaḥ pūrṇāhaṃtātmakaṃ
    mukhaṃ pradhānaṃ yasyeti yojyam-16:16 * evam aprabuddho bahirmukhavyāpāranirodhe
    grāhakasyāpyātmano 'nupapannam apyabhāvaṃ niścinuta iti pratipādya suprabuddhāprabuddhayor
    yādṛg ātmopalambhastaṃ nirūpayati-16:17]
