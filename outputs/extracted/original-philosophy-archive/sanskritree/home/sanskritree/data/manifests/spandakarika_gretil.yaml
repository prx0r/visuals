- id: spk.comm.1.17.12
  chapter: '1'
  type: commentary
  transliteration: IAST
  critical_status: gretil_import_commentary
  sanskrit: tasya prākaraṇikasvabhāvasya yopalabdhiḥ anavacchinnaḥ prakāśaḥ sā kathitayuktyavaṣṭambhāt
    suṣṭhu prabuddhasyāprabuddhatāsaṃskāreṇāpi śūnyasya satataṃ triṣvapi jāgarasvapnasauṣuptapadeṣu
    nityamiti ādau madhye'nte cāvyabhicāriṇī anapāyinī syādbhavatyeva sadāsau śaṃkarātmakasvasvabhāvatayā
    sphuratīty arthaḥ * parasyāprabuddhasya punastāsāṃ daśānāṃ svocitasaṃvidrūpāṇāṃ
    pratyekam ādāv udbubhūṣāyām ante ca viśrāntyātmakāntarmukhatve na tu svocitārthāvabhāsāvasthitirūpe
    madhyapade yaduktaṃ śrīśivadṛṣṭau / yāvat samagrajñānāgrajñātṛsparśadaśāsv api
    / sthitaiva lakṣyate sā tu tadviśrāntyāthavā phale bhaṭṭalollaṭenāpi tadādyanta
    ityevameva vyākhyāyi svavṛttau * bhaṭṭaśrīkallaṭavṛttyakṣarāṇyapekṣya vayamapi
    tadvṛttyakṣarānurodhena sautram artham ativimalamapi kliṣṭakalpanayā vyākartumaśikṣitāḥ
    yata evāsuprabuddhasya tadādyante 'sti tadupalabdhiḥ ata evāyam ihādhikārī spandopadeśaiḥ
    suprabuddhīkriyate * yadvakṣyati / * ataḥ satatamudyuktaḥ spandatattvaviviktaye
    / * jāgrat / * ityādi / * sauṣuptapadavanmūḍhaḥ prabuddhaḥ syādanāvṛtaḥ / iti
    / tathā svapne'pi / ityādi / prabuddhaḥ sarvadā tiṣṭhet ityādi ca * atra hi jāgarāditriṣu
    padeṣu ādyantakoṭivan madhyamapy arthāvasāyātmakaṃ padaṃ turyābhogamayaṃ kartuṃ
    prabuddhasya suprabuddhatāpādanāyopadeśaḥ pravṛttaḥ etac ca nirṇeṣyāmaḥ tathā
    ca śivasūtram / jāgratsvapnasuṣuptabhede turyābhogasambhavaḥ tathā / triṣu caturthaṃ
    tailavad āsecyam / iti / tritayabhoktā vīreśaḥ / iti suprabuddhasya triṣu padeṣu
    yādṛśy upalabdhis tāṃ vibhāgena darśayati]
