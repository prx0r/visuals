- id: spk.comm.4.2.40
  chapter: '4'
  type: commentary
  transliteration: IAST
  critical_status: gretil_import_commentary
  sanskrit: etacchāstroktam etajjñānam eva puruṣārthaprāptihetutvād dhanam alabhyam
    api duṣprāpam api labdhvā śaṃkarasvapnopadeśasāraṃ śilātalād avāpya prakāśavimarśātmakaṃ
    hṛdayam eva viśvāntaḥpraveśāvakāśapradatvād guhā tasyām antena niścayena kṛtā
    nihitiḥ sthāpanā yena arthāttasyaiva jñānadhanasya tasya svāminaḥ śrīvasuguptābhidhānasya
    guroryathaiva tacchivāya jātaṃ tadvadadhikāriniyamasaṃkocābhāvāt sarvalokasyāpi
    hṛdguhāntakṛtanihiter yatnād asāmayikāt gopayataḥ dṛḍhapratipattyā ca svātmīkurvataḥ
    sadā śivāya bhavati nityaśaṃkarātmakasvasvabhāvasamāveśalābhāya sampadyata iti
    śivam yadyapyasmin vivṛtigaṇanā vidyate naiva śāstre lokaścāyaṃ yadapi matimān
    bhūyasottānavṛttiḥ / jānantyete tadapi kuśalāste 'smadukter viśeṣaṃ kecit sāragrahaṇanipuṇāś
    cetanārājahaṃsāḥ anantāparaṭīkākṛnmadhye sthitim amṛṣyatā / vivṛtaṃ spandaśāstraṃ
    no guruṇā no mayāsya tu viśeṣaleśaḥ saṃdohe darśitaḥ pūrvamadya tu / rudraśaktisamāveśaśālinaḥ
    śivarūpiṇaḥ śūranāmnaḥ svaśiṣyasya prārthanātirasena tat / nirṇītaṃ kṣemarājena
    sphārānnijaguror guroḥ yeṣāṃ no dhiṣaṇopadeśaviśadā saddaiśikairdarśitā śrīmacchāmbhavaśāsanopaniṣadā
    yeṣāṃ na bhagno bhramaḥ / ye nāsvāditapūrviṇo mṛdudhiyaḥ śrīpratyabhijñāmṛtaṃ
    tenātrādhikṛtāḥ paraiḥ punar idaṃ pūrṇāśayaiś carvyatām śivādikṣityanto vitatavitato
    yo 'dhvavibhavaḥ sphurannānāsargasthitilayadaśācitritatanuḥ / iyadviśvaṃ yasya
    prasarakaṇikāsau vijayate paraḥ saṃvitspando lasadasamasaukhyāyatanabhūḥ]
