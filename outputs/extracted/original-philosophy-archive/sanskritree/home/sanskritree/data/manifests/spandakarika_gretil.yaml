  sanskrit: yadā punarayamuktāḥ paratattvasamāveśopadeśayuktīḥ pariśīlayan ekatra
    pūrṇāhaṃtātmani spandatattve samyagavicalatvena rūḍhaḥ samāviṣṭas tanmayo bhavati
    tadā tasyeti pūrvasūtranirdiṣṭasya puryaṣṭakasya taddvāreṇaiva viśvasya nimīlanonmīlanasamāveśābhyāṃ
    layodayau niyacchan prathamasūtranirṇītadṛśā ekasmād eva śaṃkarātmanaḥ svabhāvāt
    saṃhāraṃ sargaṃ ca kurvan bhoktṛtām eti dharādiśivāntasamagrabhogyakavalanena
    paramapramātṛtāṃ satīm eva pratyabhijñānakrameṇāvalambeta * tataś ca prathamasūtranirṇītasya
    śakticakrasya svamarīcinicayasyeśvaro 'dhipatir bhavet * anenaiva ca dehena maheśvaratvam
    avāpnotyeveti yāvat * evaṃ copakramopasaṃhārayor mahārthasaṃpuṭīkāraṃ darśayan
    tatsāratayā samastaśāṃkaropaniṣanmūrdhanyatām asyāviṣkaroti śāstrasya śrīmān vasuguptācāryaḥ
    iti śivam]
