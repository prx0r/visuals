- id: spk.comm.1.11.9
  chapter: '1'
  type: commentary
  transliteration: IAST
  critical_status: gretil_import_commentary
  sanskrit: uktopapattyupalabdhyanuśīlanapratyabhijñātaṃ taṃ spandatattvātmakaṃ svabhāvam
    ātmīyam adhiṣṭhātṛbhāvena vyutthānadaśāyām api vyāpnuvantam avalokayaṃś cinvānaḥ
    / na vrajen na viśecchaktir marudrūpā vikāsite / nirvikalpatayā madhye tayā bhairavarūpadhṛk
    iti tathā / sarvāḥ śaktīś cetasā darśanādyāḥ sve sve vedye yaugapadyena viṣvak
    / kṣiptvā madhye hāṭakastambhabhūtas tiṣṭhan viśvākāra eko 'vabhāsi iti śrīvijñānabhairavakakṣyāstotranirdiṣṭasampradāyayuktyā
    nimīlanonmīlanasamādhinā yugapadvyāpakamadhyabhūmyavaṣṭambhād adhyāsitaitadubhayavisargāraṇivigalitasakalavikalpo
    'kramasphāritakaraṇacakraḥ antarlakṣyo bahir dṛṣṭinimeṣonmeṣavarjitaḥ / iyaṃ sā
    bhairavī mudrā sarvatantreṣu gopitā ity āmnātabhagavadbhairavamudrānupraviṣṭo
    mukurāntarnimajjadunmajjannānāpratibimbakadambakalpamanalpaṃ bhāvarāśiṃ cidākāśa
    evoditam api tatraiva vilīyamānaṃ paśyan janmasahasrāpūrvaparamānandaghanalokottarasvasvarūpapratyabhijñānāt
    jhaṭiti truṭitasakalavṛttiḥ smayamāno vismayamudrāpraviṣṭa iva mahāvikāsāsādanāc
    ca sahasaiva samuditasamucitatāttvikasvabhāvo yo yogīndra āste tiṣṭhati na tv
    avaṣṭambhāc chithilībhavati tasyeyamiti sakalajagatkampakāriṇī kutsitā jananamaraṇādiprabandharūpā
    sṛtiḥ pravṛttiḥ kuto nijāśuddhilakṣaṇasya taddhetor abhāvān naiva bhavatītyarthaḥ
    yathoktaṃ śrīpūrvaśāstre / tattve niścalacittas tu bhuñjāno viṣayān api / naiva
    saṃspṛśyate doṣaiḥ padmapattram ivāmbhasā viṣāpahārimantrādisaṃnaddho bhakṣayannapi
    / viṣaṃ na muhyate tena tadvadyogī mahāmatiḥ iti* atha ye śrutyantavidakṣapādamādhyamikādayaḥ
    kṣobhapralaye viśvocchedarūpam abhāvātmakameva tattvam avaśiṣyata ity upādikṣan
    tān pratibodhayituṃ tadupagatatattvaprātipakṣyeṇa lokottaratāṃ prakaraṇaśarīrasya
    spandatattvasya nirūpayati]
