- id: spk.comm.1.12.10
  chapter: '1'
  type: commentary
  transliteration: IAST
  critical_status: gretil_import_commentary
  sanskrit: asad evedam agra āsīt-13:1 * ityādyuktyā śrutyantavidādyabhimato 'bhāvo
    bhāvyatāṃ naiti bhāvanāyā bhāvyavastuviṣayatvād abhāvasya na kiṃcittvād bhāvyamānatāyāṃ
    vā kiṃcittve satyabhāvatvābhāvāt kiṃca bhāvakasyāpi yatrābhāvaḥ sa viśvocchedaḥ
    kathaṃ bhāvanīyaḥ bhāvakābhyupagame tu na viśvocchedo bhāvakasyāvaśiṣyamāṇatvād
    iti na viśvābhāva eva tattvam-13:2 * atha kalpito 'yaṃ bhāvako viśvocchedaṃ vikalpakalpyamānaṃ
    bhāvayan bhāvanāpariniṣpattau bhāvyatādātmyād abhāvarūpaḥ sampadyata iti pakṣaḥ-13:3
    tatrocyate tatrābhāvabhāvanāyāṃ nāmūḍhatā na ca tatrāsty amūḍhatā api tu moha
    evāsti / yadyad evātibhāvyate / bhāvanāpariniṣpattau tatsphuṭaṃ kalpadhīphalam-13:4
    iti nyāyād viśvocchedātmanyabhāve bhāvyamāne na kadācit paramārthāptir bhavati-13:5
    athocyate / sarvālambanadharmaiś ca sarvatattvair aśeṣataḥ / sarvakleśāśayaiḥ
    śūnyaṃ na śūnyaṃ paramārthataḥ-13:6 iti nāgārjunoktam īdṛśaṃ tac chūnyamiti-13:7
    * satyaṃ yadi cidānandaghanā svatantrā pāramārthikī bhittibhūtā bhūr abhyupeyate
    yathā vijñānabhairavādau pārameśvarīṃ dikkālakalanātītā-13:8 * ityādinā pāramārthikīṃ
    bhittibhūtāṃ cidbhūmim avasthāpya śūnyabhāvanoktā anyathā na śūnyam iti śūnyaiveyam
    uktiḥ yadyad evātibhāvyate iti pratipāditatvāt-13:9 * yattu-13:10 sāvasthā kāpy
    avijñeyā mādṛśāṃ śūnyatocyate / na punar lokarūḍhyeva nāstikyārthānupātinī-13:11
    ityālokamālāyām uktaṃ tat tu satyaṃ tvādṛśām avijñeyā avijñeyatvād vaktum aśakyety
    ucyatāṃ śūnyateti tu kutaḥ śūnyatāpi ca yāvad bhāvyate tāvad vikalpollikhitatvād
    asau vivejñaiya-13:12 * yadi ca tvādṛśāṃ sā jñātumaśakyā tat tatpadasākṣātkārābhijñasadgurusaparyā
    kāryā na tu śūnyateti svamanīṣikayaiva vyavahṛtyātmā paraś cāgādhe mahāmohe nikṣeptavya
    ityalam-13:13 * atha kuto jñātaṃ tatra mūḍhatāstītyatrānenottaram āha yata iti-13:14
    * abhiyogaḥ samādhānotthitasya kīdṛgaham āsamiti tadavasthābhimukhavimarśātmābhilāpas
    tatsaṃsparśāt tadvaśāddhetos tad āsīd iti yato niścayaḥ gāḍhamūḍho 'ham āsam iti
    yato 'sti pratipattiḥ ato mohāvasthaiva sā kalpitā tathā smaryamāṇatvāt sā cānubhūyamānatvād
    anubhavituḥ pramātur avasthātṛrūpasya pratyuta sattām āvedayate na tv abhāvamiti
    viśvābhāvāvasthāyāṃ cidrūpasyākhaṇḍitameva rūpaṃ tiṣṭhatīti nāmuṣyābhāvo jātucid
    vaktuṃ śakyata ityuktaṃ bhavati-13:15 * nanu dṛṣṭaṃ niścitaṃ nīlādi smaryate na
    ca śūnyabhūtasya nyagbhūtabuddhivṛtter niścayo 'sti tat kathamuktaṃ tad āsīd ityauttarakālikān
    niścayān mūḍhatā seti-13:16 * ucyate vedyasyaiṣā gatiḥ yasmāt tadidaṃtāsāramidaṃtayā
    yāvatpramātrā svātmopāroheṇa na niścitaṃ tāvan na smaryate vedakastu kalpitaśūnyādyavasthāsu
    saṃkucito 'py asāṃketikāhaṃtāparamārtha eveti na tasya svātmani pṛthaktāstīti
    tanniścāyako vikalpaḥ ityahaṃvimṛśyameva tadā svasaṃvedane naiva siddhaṃ śūnyapramātṛrūpaṃ
    viśvapratiyogitvāc ca saṃkocasāra-13:17 saduttarakālaṃ smaryata iti na kācid anupapattir
    yasmād evamatas tac chūnyātmakaṃ padaṃ kṛtrimam tasmād bhūtamabhūtaṃ vā yad yad
    evātibhāvyate / iti taduktayaiva nītyā abhūtabhāvanayaivotthāpitaṃ parameśvareṇaiva
    jñānagopanāyai mūḍhānām upeyatayā tathā bhāsitamityarthaḥ-13:18 jñeyaṃ jñātavyaṃ
    jñeyarūpaṃ ca sadā suṣuptavaditi dṛṣṭāntaḥ-13:19 * ayaṃ bhāvaḥ sadā suṣuptaṃ moharūpamaprayāsasiddhaṃ
    sarvasyāstyeva tat kim anena samādhiprayatnopārjitenānyena śūnyena kṛtyaṃ dvayasyāpyavastutvāviśeṣād
    iti-13:20 * prāyaścāsmin śūnye duruttare mahāmohārṇava eva vedāntavidakṣapādasāṃkhyasaugatādiprāyā
    bahavo 'nupraviṣṭāḥ-13:21 * spandatattvasamāvivikṣūṇām api ca śithilībhūtaprayatnānāṃ
    śūnyam etad vighnabhūtam-13:22 yadvakṣyati / tadā tasminmahāvyomni-13:23 ityārabhya
    / sauṣuptapadavanmūḍhaḥ-13:24 iti-13:25 * ata etaducchede granthakārasya mahān
    saṃrambho lakṣyate-13:26 tathā ceha heyatayaiva tan nirṇīyāpi punarapi nirṇeṣyate
    / kāryonmukhaḥ prayatno yaḥ / ityatra-13:27 tato 'smābhir etaddūṣaṇārambhaḥ kṛta
    iti na naḥ kopaḥ kāryo 'trabhavadbhir upadeśanibhālanadattakarṇaiḥ-13:28 * saugateṣu
    dūṣiteṣu śrutyantavādādayo dūṣitā eva tulyanyāyatvād iti nābhyadhikam uktam-13:29
    * tadidānīṃ prakṛtameva brūmahe tattu spandākhyaṃ tattvamevamiti śūnyavan na smaryamāṇatvaṃ
    pratipadyate tasya sarvadānusyūtopalabdhrekarūpasya kadācid apy anupalabhyatvāyogāt-13:30
    tathā cāhuḥ / vijñātāram ere kena vijānīyāt-13:31 iti-13:32 * yadyapi ca samāveśadaśā
    vyutthitena prāṇādisaṃskāravaśāt smaryate tathāpi na tāvadeva spandatattvamapi
    tu sarvānusyūtānavacchinnaprakāśānandasāraparapramātṛrūpam eva tat-13:33 yadvakṣyati
    / tasmācchabdārthacintāsu na sāvasthā na yā śivaḥ-13:34 iti-13:35 * ato'syānavacchinnacamatkārarūpasya
    na jātucitsmaryamāṇatvaṃ mūḍhatvaṃ vā-13:36 * yastu tattattvamitīha tacchabdenāsya
    nirdeśaḥ kṛtaḥ sa-13:37 * svātantryāmuktam ātmānam-13:38 * iti śrīpratyabhijñākārikoktanītyā
    kalpitasyaivāpāramārthikasvarūpasya na tu tattvataḥ pāramārthikasya-13:39 * na
    pratipadyata ityanenedam āha asya tattvasya smaryamāṇatvena pratītir eva nāstīti-13:40
    * nanu yatra sthitamityādau cidrūpasyaiva viśvakāryarūpatāgrāhitvamuktaṃ taddhyānotthāpitaṃ
    kṛtrimamabhāvātmakaṃ rūpaṃ te naiva gṛhītamiti katham asyānavacchinnacamatkārarūpam
    amūḍhatvam ityāśaṅkāyām āha-13:41]
