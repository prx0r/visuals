- id: spk.comm.2.6.22
  chapter: '2'
  type: commentary
  transliteration: IAST
  critical_status: gretil_import_commentary
  sanskrit: iha śivo bhūtvā śivaṃ yajet iti yad udghoṣyate tatra dhyāyinaś cetasi
    saṃvedane tasyeti na sāvasthā na yā śivaḥ iti pratipāditaśivasvabhāvasya dhyeyasya
    anyasya vā kasyacit tattatsiddhihetor mantradevatāviśeṣasya ayam evodayaḥ prakaṭībhāvaḥ
    yā sādhakasya dhyāturācāryādeḥ / tasmācchabdārthacintāsu na sāvasthā na yā śivaḥ-7:1
    iti pratipāditarūpā tadātmatāsamāpattiḥ śivaikyāveśo na tu pañcavaktrādervyatiriktasyākārasya
    darśanaṃ na tu niścayamātreṇa tadātmatāsamāpattiḥ api tu icchato 'vikalpaviśvāhaṃtātmakaśivaikyarūpecchāparāmarśādhirūḍhasya-7:2*
    etad uktaṃ bhavati ahameva tatsaṃvedanarūpeṇa tādātmyapratipattito viśvaśarīraś
    cidānandaghanaḥ śiva iti saṃkalpo yasyāvikalpaśeṣībhūtatvena phalati tasya dhyeyamantradevatādi
    kiṃ na nāma abhimukhībhavati sarvasyaitadadvayaprathālagnatvāt-7:3 yathoktamasmatparameṣṭhipādaiḥ
    / sākṣādbhavanmaye nātha sarvasmin bhuvanāntare / kiṃ na bhaktimatāṃ kṣetraṃ mantraḥ
    kvaiṣāṃ na sidhyati-7:4 iti-7:5* iyameva ca samāpattiḥ paramādvayarūpasyāmṛtasya
    prāptiḥ anyasmiṃs tv amṛte katipayakālaśarīradārḍhyadāyini prāpte'pi sādhakairmaraṇamavaśyamavāpyata
    evety evakārāśayaḥ-7:6 evaṃ sarvatrānenaivāśayena śrīsvacchande sthūladṛṣṭyāmṛtaprāptiprakaraṇe
    / naiva cāmṛtayogena kālamṛtyujayo bhavet-7:7 ityuktyopasaṃhṛtya tāttvikas tatprāptiprakāraḥ
    / athavā paratattvasthaḥ sarvakālairna bādhyate-7:8 ityādinā-7:9* sarvaṃ śivaśaktimayaṃ
    smaret-7:10 iti madhyena / * jīvann eva vimukto 'sau yasyeyaṃ bhāvanā sadā / yaḥ
    śivaṃ bhāvayen nityaṃ na kālaḥ kalayettu tam / yogī svacchandayogena svacchandagaticāriṇā
    / sa svacchandapade yuktaḥ svacchandasamatāṃ vrajet / svacchandaścaiva svacchandaḥ
    svacchando vicaret sadā-7:11 ityanena sahajasaṃdarbheṇa sapraśaṃsaṃ paścādupadiṣṭaḥ-7:12
    ayamevātmano graho jñānaṃ yaducyate ātmā jñātavya iti tatredam eva sarvajñasarvakartṛsvatantraśivasvarūpatayā
    pratyabhijñānam ātmano jñānaṃ na tu / puruṣa evedaṃ sarvam-7:13 iti śrutyantaviduktam
    / ta ātmopāsakāḥ sarve na gacchanti paraṃ padam-7:14 ityāmnāyokteḥ-7:15 * tathā
    dīkṣāvasare yojanikādyarthamayameva śiṣyātmano'nugrahaḥ imāmeva samāpattiṃ vidvānācāryaḥ
    śiṣyātmānaṃ śive yojayannācāryo bhavatītyarthaḥ-7:16 * iyaṃ svapratyayasiddhā
