  sanskrit: puryaṣṭakotthitaṃ bhogaṃ bhuṅkte-18:1 * yata eva pratyayeṣu sukhādipratyayodbhavaḥ
    ata evāsau pratyayodbhavāt paśuḥ paravaśaḥ śabdānuvedhakrameṇa pade pade brāhmyādidevībhir
    ākṣipyamāṇaḥ na tu suprabuddhavat svatantraḥ tasya puryaṣṭakasya bhāvādeva punaḥpunarudbodhitavicitravāsanaḥ
    saṃsaret tattadbhogocitabhogāyatanāni śarīrāṇyarjayitvā gṛhṇāti cotsṛjati ca-18:2
    * yataś caivam ato 'sya puryaṣṭakasaṃruddhasya yā saṃsṛtis tasyā yaḥ prakṛṣṭo
    layaḥ puryaṣṭakātmakamalocchedena vināśaḥ tasya kāraṇaṃ samyak sukhopāyaṃ pracakṣmahe
    samanantaram eva brūmaḥ tathā sampracakṣmahe prakaraṇe 'smin svayaṃ pratipāditavantaḥ-18:3
    * vartamānasāmīpye vartamānavad vā-18:4 * iti vartamānaprayogaḥ-18:5 * etat pratipādayan
    ādyasūtroktamarthaṃ nigamayati-18:6]
