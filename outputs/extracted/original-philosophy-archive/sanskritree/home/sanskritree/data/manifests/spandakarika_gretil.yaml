- id: spk.comm.2.1.19
  chapter: '2'
  type: commentary
  transliteration: IAST
  critical_status: gretil_import_commentary
  sanskrit: tat spandatattvātmakaṃ balaṃ prāṇarūpaṃ vīryamākramya abhedena āśrayatayāvaṣṭabhya
    bhagavanto 'nantavyomavyāpyādayo mantrāḥ sarvajñabalena sarvajñatvādisāmarthyena
    ślāghamānā jṛmbhamāṇā adhikārāya dehināṃ pravartante sṛṣṭisaṃhāratirodhānānugrahādi
    kurvantītyarthaḥ * sarvajñaśabdo bhāvapradhānaḥ sarvakartṛtvādy upalakṣayati *
    yathā dehināṃ karaṇāny upapāditadṛśā tadbalamākramya viṣayaprakāśādau pravartante
    iti dṛṣṭāntaḥ * tathā nirañjanāḥ kṛtakṛtyatvān nivṛttādhikāramalāḥ śāntaviśiṣṭavācakātmasvarūpās
    tatraiva spandātmake bale samyagabhedāpattyā prakarṣeṇāpunarāvṛttyā līyante adhikamalānmucyante
    ārādhakacittena upāsakalokasaṃvedanena saha yathoktam / anugṛhyāṇusaṃghātaṃ yātāḥ
    padam anāmayam iti * yataśca tata evoditāstadbalena visṛṣṭās tatraiva līyante
    tenaite mantramantreśvarādayaḥ śivasya parameśvarasya sambandhī dharmaḥ svabhāvo
    vidyate yeṣāṃ te tathā sāmānyaspandasārā ityarthaḥ * nanu karaṇānāṃ mantrāṇāṃ
    ca tat udayādau tulye kimiti karaṇāni na sarvajñādirūpāṇi * ucyate parameśvaro
    māyāśaktyā śarīrakaraṇāni bhedamayāni nirmimīte vidyāśaktyā tv ākāśīyavicitravācakaparāmarśaśarīrān
    mantrān * vācakasya māyāpade 'pi ghaṭo 'yam ityadhyavasā nāmarūpātirekiṇī / pareśaśaktirātmeva
    bhāsate na tv idaṃtayā iti pratyabhijñoktanītyā pramātṛbhūmyanatikrānter na śarīrapuryaṣṭakādivadbodhasaṃkocakatvam
    astīti yuktamevaiṣāṃ sarvajñatvādi etac ca / bhede tv ekarase bhāte iti śrīpratyabhijñākārikāṭīkāyāṃ
    vitatya darśitam * evaṃ vidyāpadāvasthitasṛṣṭyādikāryanantabhaṭṭārakādyapekṣayaitad
    vyākhyeyam * tathā dīkṣādipravṛttānām ācāryādīnāṃ karaṇarūpāḥ sarve mantrās tatspandatattvarūpaṃ
    balam ākramya anuprāṇakatvena avaṣṭabhya ācāryādīnām eva sambandhinārādhakacittena
    saha mokṣabhogasādhanādyadhikārāya pravartante tatraiva śāntavācakaśabdātmakaśarīrarūpā
    ata eva ca nirañjanāḥ śuddhāḥ samyak pralīyante viśrāmyanti * atra vyākhyāne sahārādhakacittena
    iti pūrvaślokena yojyam * evaṃ ca mantrāṇāmudayapralayakoṭivyāpi pravṛttāv api
    bhittibhūtamiti abhihitam * evaṃ ca daśāṣṭādaśādibhedena bhinne śaive mantrāṇāṃ
    spandatattvasārataivetyuktaṃ bhavati * evaṃ mantramantreśvarādirūpā śuddhābhimatā
    sṛṣṭiḥ śivasvabhāveti pratipādyādhunā aśuddhābhimatāpi sā māyādirūpā śivasvarūpaiva
    iti upapādayan śrīmataśāstrādirahasyadṛṣṭim api upakṣipati]
