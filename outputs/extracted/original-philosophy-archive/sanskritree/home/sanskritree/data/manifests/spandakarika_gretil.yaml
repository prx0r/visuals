    bhagavatānatikramāt-2:9 * parameśvaro hi cidātmā yady antarmukhocitasevākrameṇārthyate
    tat tat saṃpādayata eva jāgrataḥ iti paratattve jāgarūkasya jāgarāvasthāsthasya
    ceti śleṣoktyā vyākhyeyam-2:10 * yadi punarevaṃ sāvadhāno na bhavati tadā nāsya
    yogitetyāha-2:11]
