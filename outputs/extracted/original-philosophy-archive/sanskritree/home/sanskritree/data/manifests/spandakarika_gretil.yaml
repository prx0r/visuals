- id: spk.comm.2.3.20
  chapter: '2'
  type: commentary
  transliteration: IAST
  critical_status: gretil_import_commentary
  sanskrit: yato jīvo grāhakaḥ sarvamayaḥ śivavad viśvarūpaḥ tena hetunā śabdeṣu vācakeṣu
    artheṣu vācyeṣu cintāsu vikalpajñānādirūpāsu ādimadhyāntarūpā sāvasthā nāsti yā
    śivo na bhavati sarvameva śivasvarūpam ityarthaḥ-4:1 * yataś caivamato bhoktaiva
    cidātmā grāhako bhogyabhāvena dehanīlādirūpeṇa sadā nityaṃ sarvatra vicitratattvabhuvanādipade
    samyaganūnādhikatayā sthitaḥ na tu bhogyaṃ nāma kiṃcidbhoktur bhinnam asti-4:2
    * jīva ityupakramya śiva ityupasaṃhāreṇa jīvaśivayorvāstavo na ko 'pi bhedaḥ iti
    dehādyavasthāsu na kāsucid apyapūrṇamanyatā mantavyā api tu cidghanaśivasvabhāvataiveti
    bhaṅgyopadiśati-4:3 * yathoktam śarīramapi ye ṣaṭtriṃśattattvamayaṃ śivarūpatayā
    paśyanti arcayanti ca te sidhyanti ghaṭādikam iva tathābhiniviśya paśyanti arcayanti
    ca te 'pīti nāstyatra vivādaḥ iti śrīpratyabhijñāṭīkāyām-4:4 bhaṭṭaśrīvāmanenāpyuktam
    / ālambya saṃvidaṃ yasmāt saṃvedyaṃ na svabhāvataḥ / tasmātsaṃviditaṃ sarvamiti
    saṃvinmayo bhavet-4:5 iti-4:6 * kasmāt jīvaḥ sarvamayaḥ ityatra hetuḥ sarvabhāvānāṃ
    samudbhavād utpattihetutvāt apādānabhāvapradhānaśca nirdeśaḥ-4:7 pramātṛmitimānameyamayabhedajātasya
    te vihāra iha hetutāṃ samupayāti yasmāt tvayi / nivṛttavivṛtau kvacit tad apayāti
    tenādhvādhunā nayena punarīkṣyate jagati jātucitkenacit-4:8 iti śrījñānagarbhastotroktanītyā
    saṃvidyeva prasṛtāyāṃ jagataḥ sadbhāvāt sarvabhāvasamudbhavatvaṃ jīvasya yataśca
    jīvādeva udayati viśvamato'yaṃ sarvamayo viśvaśaktiriti yāvat-4:9 * nirṇītaṃ caitad
    dvitīyasūtravṛttau-4:10 * sarvamayatve hetvantaramāha tatsaṃvedana ityardhena-4:11
    * tasya sarvasya nīlasukhāderyatsaṃvedanaṃ prakāśastena rūpeṇa svabhāvena tādātmyapratipatteḥ
    sarvamayatvasyopalambhāt-4:12 * evamanena ślokadvayena rahasyacaryāḥ sarvabhedapādaponmūlopapattiparighaṭitāś
    ca jñānopadeśakathāḥ prathamacaramasūtrābhyāṃ mahārthatattvaṃ jāgradādisūtreṇa
    ṣaḍardhaparamārthaḥ tadākramya ity anena sarvopāsāsāratetyādyupakṣiptam iti spandatattvenaiva
    viśvopadeśāḥ svīkṛtāḥ-4:13 * athaitatpratipattisārataiva mokṣa ityādiśati-4:14]
