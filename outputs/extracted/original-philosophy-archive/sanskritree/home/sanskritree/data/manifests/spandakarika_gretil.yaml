- id: spk.comm.3.14.34
  chapter: '3'
  type: commentary
  transliteration: IAST
  critical_status: gretil_import_commentary
  sanskrit: tasya paśoryaḥ pratyayānāṃ laukikaśāstrīyavikalpānāṃ tadadhivāsitānāṃ
    bhinnārthajñānānāṃ vikalpānām apyudbhavaḥ vināśāghrāta utpādaḥ sa parasyāmṛtarasasya
    cidghanasyānandaprasarasyāpāyo nimajjanam * uditeṣu bhinnārtheṣu pratyayeṣu cidbhūmiḥ
    sthitāpy aparāmṛśyamānatvād asthiteva lakṣyate tata evam uktam * tena ca pratyayodbhavenāyam
    asvatantratām eti tadvaśaḥ sampadyate * yaduktaṃ śrīśivasūtreṣu jñānaṃ bandhaḥ
    iti * śrīmadvyāsamunināpi mātāpitṛmayo bālye iti * śrīmadālasayāpi tāteti kiṃcittanayeti
    kiṃcit ambeti kiṃciddayiteti kiṃcit / mameti kiṃcin na mameti kiṃcit bhautaṃ saṃghaṃ
    bahudhā mā lapethāḥ iti * pratyayasyodbhavastanmātrāṇi tīvrātīvrabhedasāmānyavṛttayo
    gocaro yasya tathābhūto bhinnavedyaviṣaya ityarthaḥ * anenedamāha yāvadiyaṃ bhinnavedyaprathā
    tāvad baddha eva yadā tūktopadeśayuktyā sarvam ātmamayam evāvicalapratipattyā
    pratipadyate tadā jīvanmukta iti * yathoktam iti vā yasya saṃvittiḥ ityādi * evaṃ
    ca yat pūrvam uktaṃ tasmācchabdārthacintāsu na sāvasthā na yā śivaḥ ityādi na
    tena saha parāmṛtarasāpāyas tasya yaḥ pratyayodbhavaḥ ityasya vaiṣamyaṃ kiṃcit
    * nanu yadi pratyayodbhavo 'pyasya parāmṛtarasāpāyaḥ tatkatham uktaṃ śaktivargasya
    bhogyatāṃ gata ityāśaṅkāṃ pariharati]
