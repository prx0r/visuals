- id: spk.comm.1.22.17
  chapter: '1'
  type: commentary
  transliteration: IAST
  critical_status: gretil_import_commentary
  sanskrit: sarvatra tāvad upāyamārge samastetaravṛttipraśamapūrvam ekāgrībhavanti
    yoginaḥ etāsvatikrodhādyavasthāsu svarasata eva samastāparavṛttikṣayamayīṣu yadi
    spandatattvaviviktaye satatam udyukto jhaṭity antarmukhībhavanti yoginas tatsamīhitam
    acireṇaiva labhante * ayoginastvatra mūḍhā eveti tātparyam * tathāhi samanantaravihitadāruṇopaghātaśatrudarśanān
    marmasparśitattadvacanākarṇanād vā prathamam evonmiṣatsaṃjihīrṣādevatābalād antarmukhībhavadraśmicakro
    'tikruddhaḥ ciraprārthitaprāṇeśīvadanendudarśanād eva tatkṣaṇam evonmajjatpūrṇābhilāṣadevatāvaśavikāsitānudhāvatsamastakaraṇacakraḥ
    prahṛṣṭo vā balavadātatāyibalena sarvato valitatvāt kāndiśīkaḥ kiṃ karomīti mṛśan
    vikalpayan saṃśayadhārādhirohātmani pade 'nupraviṣṭaḥ kṣīṇasakalālambanavikasatsaṃśayasaṃvinnirālambanīkṛtavṛttiprasaro
    vā mattavāraṇādyanubadhyamāno dhāvan śarīranirapekṣam eva svātmapravaṇīkṛtetaravṛttiprasaradudyogadevīpreraṇayātitvaritapalāyanakriyāviṣṭo
    vā evam anyāsv apy evamprāyāsu siṃhājagarādyavalokanajanitamahātrāsādyavasthāsu
    yad vṛttikṣayātmakaṃ padaṃ gacched adhitiṣṭhet spandatattvaviviktaye satatam udyukto
    yo yogijanas tasya tatra vṛttikṣayātmake pade 'vasthāviśeṣe spandaḥ pratiṣṭhitaḥ
    spandatattvam abhimukhībhūtameva tiṣṭhati * tasmād etad vṛttikṣayapadaṃ saṃcetya
    jhaṭiti kūrmāṅgasaṃkocayuktyā krodhasaṃśayavṛttīḥ praśamayya mahāvikāsavyāptiyuktyā
    vā praharṣadhāvanavṛttīr visphāryābhimukhībhūtanijaspandaśaktivimarśavatā yoginā
    bhayam yathoktaṃ śrīvijñānabhairave / kāmakrodhalobhamohamadamātsaryagocare /
    buddhiṃ nistimitāṃ kṛtvā tat tattvam avaśiṣyate ānande mahati prāpte dṛṣṭe vā
    bāndhave cirāt * ānandam udgataṃ dhyātvā tallayas tanmanā bhavet kṣutādyante bhaye
    śoke gahvare vāraṇadrute / kutūhale kṣudhādyante brahmasattā samīpagā iti * evam
    etāsv avasthāsūktayuktyā prathamaṃ spandaśaktiṃ pariśīlya tadanu tām evānusaṃdadhat
    sarvāsvavasthāsu taddārḍhyānupraveśamayīṃ jīvanmuktatām āharet satatodyukta ityupadiśati]
