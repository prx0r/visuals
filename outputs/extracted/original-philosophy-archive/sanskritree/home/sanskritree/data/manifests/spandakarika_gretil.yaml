- id: spk.comm.1.20.15
  chapter: '1'
  type: commentary
  transliteration: IAST
  critical_status: gretil_import_commentary
  sanskrit: aprabuddhadhiyaḥ prāyaḥ sarvān apratyabhijñātapārameśvarīśaktyātmakanijaspandatattvān
    dehātmamānino laukikān prāṇādyātmābhimāninaś ca mitayoginas tv ete pūrvoktā guṇādispandaniḥṣyandāḥ
    svasyāḥ spandatattvātmanaḥ sthiteḥ sthaganāyodyatā nityaṃ tadudyamaikasārāḥ duḥkhenottāryante
    'smād daiśikair jantucakramiti duruttāre laṅghayitum aśakye ghore duḥkhamaye saṃsaraṇamārge
    pātayanti yathoktaṃ śrīmālinīvijaye / viṣayeṣveva saṃlīnānadho'dhaḥ pātayantyaṇūn
    / rudrāṇūnyāḥ samāliṅghaya ghorataryo 'parāḥ smṛtāḥ iti * tathā hi pūrvaṃ pratipāditā
    yeyaṃ spandatattvātmā parāśaktiḥ saiva viśvasyāntarbahiś ca vamanāt saṃsāravāmācāratvāc
    ca vāmeśvarīśaktiḥ tadutthāpitāni tu khecarīgocarīdikcarībhūcarīrūpāṇi catvāri
    devatācakrāṇi suprabuddhasya parabhūmisaṃcārīṇi aprabuddhānāṃ tu adharādharasaraṇiprerakāṇi
    * tathā hi yā eva suprabuddhasya khe bodhagagane carantyaḥ khecaryo 'kālakalitatvābhedasarvakartṛtvasarvajñatvapūrṇatvavyāpakatvaprathāhetavas
    tā evāprabuddhasya śūnyapramātṛpadacāriṇyaḥ kañcukarūpatayā sthitāḥ kālakalitatvakiṃcitkartṛtākiṃcijjhatābhiṣvaṅganiyamahetavaḥ
    * gaur vāk tadupalakṣitāsu saṃjalpamayīṣu buddhyahaṃkāramanobhūmiṣu carantyo gocaryaḥ
    suprabuddhasya svātmābhedamayādhyavasāyābhimānasaṃkalpāñ janayanti mūḍhānāṃ tu
    bhedaikasārān * dikṣu daśasu bāhyendriyabhūmiṣu carantyo dikcaryaḥ suprabuddhasyādvayaprathāsārāḥ
    anyeṣāṃ dvayaprathāhetavaḥ * bhūrūpādipañcakātmakaṃ meyapadaṃ tatra carantyo bhūcaryas
    tadā bhogamayyā āśyānībhāvatayā tanmayatvamāpannāḥ bhūcaryaḥ suprabuddhasya citprakāśaśarīratayātmānaṃ
    darśayantya itareṣāṃ sarvato 'py avacchinnatāṃ prathayantyaḥ sthitāḥ ity evaṃ
    pramātrantaḥkaraṇabahiṣkaraṇaprameyarūpatayaiva tāni catvāri cakrāṇi guṇādispandamayāny
    aprabuddhabuddhīṃl laukikāṃs tathā bindunādādiprathāmātrasaṃtuṣṭān yoginas tattattvaprasararūpe
    saṃsāre pātayanti * yata evam]
