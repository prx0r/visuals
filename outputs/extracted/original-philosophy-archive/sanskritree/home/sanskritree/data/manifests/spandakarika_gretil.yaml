- id: spk.comm.3.13.33
  chapter: '3'
  type: commentary
  transliteration: IAST
  critical_status: gretil_import_commentary
  sanskrit: iha yo 'yaṃ prakāśātmā svasvabhāvaḥ śāṃkara uktaḥ asau / vyavasthitaḥ
    karotyeṣa viśvakāraṇam īśvaraḥ / sṛṣṭiṃ sthitiṃ ca saṃhāraṃ tirodhānamanugraham
    iti śrīsvacchandaśāstradṛṣṭyā nijaśaktyāśliṣṭaḥ sadā pañcavidhakṛtyakārī svatantraḥ
    spandalaliteśvarādiśabdair āgameṣūdghoṣyate* svātantryaśaktir evāsya sanātanī
    pūrṇāhaṃtārūpā parā matsyodarī mahāsattā sphurattormiḥ sāraṃ hṛdayaṃ bhairavī
    devī śikhā ityādibhir asaṃkhyaiḥ prakārais tatra tatra nirucyate* pūrṇāhaṃtaiva
    cāsyānuttarānāhataśaktisaṃpuṭīkārasvīkṛtādikṣāntavarṇabhaṭṭārikā tata eva svīkṛtānantavācyavākarūpaṣaḍadhvasphāramayāśeṣaśakticakrakroḍīkārāntaḥ
    kṛtaniḥśeṣasargapralayādiparamparāpyakramavimarśarūpaiva nityoditānuccāryamahāmantramayī
    sarvajīvitabhūtā parā vāk* eṣaiva bhagavata iyadviśvavaicitryacalattām iva svātmani
    prathayantī spandate ityarthānugamāt spanda iti ihocyate* evaṃ ceyad viśvaśaktikhacitaparāśaktisundarasya
    svātmanaḥ svarūpagopanakrīḍayā svātmabhittāv evāṃśāṃśikayā nirbhāsanaṃ bhagavān
    yāvaccikīrṣati tāvadekaivābhinnāpyasau tadīyā vimarśaśaktiricchātvaṃ pratipadya
    jñānakriyārūpatayā sthitvā śivaśaktiparāmarśātmakabījayonibhedena dvidhā bhūtvā
    vargabhedena tatkalābhedena ca navadhā pañcāśaddhā ca sphurantī tadvimarśasārair
    aghoraghoraghorataraiḥ saṃvittidevatātmabhiḥ rūpaiḥ prathamānā bhagavataḥ pañcavidhakṛtyakāritāṃ
    nirvahati yathoktaṃ śrīmālinīvijayottare / yā sā śaktirjagaddhātuḥ kathitā samavāyinī
    / icchātvaṃ tasya sā devī sisṛkṣoḥ pratipadyate saikāpi satyanekatvaṃ yathā gacchati
    tacchṛṇu / evametaditi jñeyaṃ nānyatheti suniścitam jñāpayantī jagatyatra jñānaśaktirnigadyate
    / evaṃ bhavatvidaṃ sarvamiti kāryonmukhī yadā jātā tadaiva tadvastu kurvatyatra
    kriyocyate / evameṣā dvirūpāpi punarbhedairanantatām arthopādhivaśād yāti cintāmaṇiriveśvarī
    / tatra tāvatsamāpannā mātṛbhāvaṃ vibhidyate dvidhā ca navadhā caiva pañcāśaddhā
    ca mālinī / bījayonyātmakādbhedāddvidhā bījaṃ svarā matāḥ kādayaśca smṛtā yonirnavadhā
    vargabhedataḥ / pṛthagvarṇavibhedena śatārdhakiraṇojjvalā bījamatra śivaḥ śaktir
    yonir ityabhidhīyate / vargāṣṭakamiti jñeyamaghorādyamanukramāt tadeva śaktibhedena
    māheśvaryādi cāṣṭakam / śatārdhabhedabhinnā ca tatsaṃkhyānāṃ varānane rudrāṇāṃ
    vācakatvena kalpitā parameṣṭhinā / tadvadeva ca śaktīnāṃ tatsaṃkhyānāmanukramāt
    ityādi tathā / viṣayeṣveva saṃlīnānadho'dhaḥ pātayantyaṇūn / rudrāṇūnyāḥ samāliṅgya
    ghorataryo 'parāstu tāḥ miśrakarmaphalāsaktiṃ pūrvavajjanayanti yāḥ* muktimārganirodhinyastāḥ
    syur ghorāḥ parāparāḥ pūrvavajjantujātasya śivadhāmaphalapradāḥ / parāḥ prakathitās
    tajjñair aghorāḥ śivaśaktayaḥ iti* evaṃ śabdarāśeḥ samutthito varganavakarūpo
    yo brāhmyādidevatāvargaḥ śivasahitastasya bhogyatāṃ pāśyatāṃ gataḥ sansa eva śaṃkarātmā
    svabhāvaḥ paśuḥ smṛtaḥ āgameṣu tathoktaḥ* nanu kathaṃ bhoktā maheśvara imāmavasthāṃ
    prāptaḥ ityāśaṅkāśāntyai viśeṣaṇadvāreṇa hetumāha kalāviluptavibhava iti* kalayati
    bahiḥ kṣipati pārimityena paricchinattīti kalā māyāśaktiḥ tayā viluptavibhavaḥ
    svamāyayā gūhitaiśvaryaḥ sthita ityarthaḥ* atha ca kalayā kiṃcitkartṛtvopodbalanātmanā
    śaktyā tadupalakṣitena kalāvidyākālaniyatirāgātmanā kañcukena viluptavibhavaḥ
    sthagitapūrṇatvakartṛtvādidharmaḥ* bhavatvevaṃ bhogyatāṃ tu kathamasau śaktivargasya
    gataḥ ityatraitad evottaram* kalābhir akārādivargādhiṣṭhāyikābhir brāhmyādibhis
    tadvarṇabhaṭṭārakādhiṣṭhātṛbhūtābhiś ca śrīmālinīvijayoktadevatārūpābhiḥ kalābhir
    akārādivarṇair viluptavibhavaḥ saṃkucito'smi apūrṇo 'smi karavāṇi kiṃcididam upādade
    idaṃ jahāmi ityādivicitravikalpakāvikalpakapratipattikadambakāntaranupraviṣṭasthūlasūkṣmaśabdānuvedhakadarthito
    harṣaśokādirūpatāṃ nenīyamāna iva kṣaṇam api svarūpasthitiṃ na labhate yataḥ ato'sāv
    uktarūpaḥ śaktivargeṇa bhujyamānaḥ paśur uktaḥ* kalayā akhyātyātmanāṃśena viluptavibhavaḥ
    saṃkucita iva na tu tattvataḥ śivātmā svabhāvo 'sya kvāpi gataḥ tadabhāve hi sa
    eva na sphuret* tathāvabhāsamānaireva kalābhiḥ saṃkucitaiḥ śabdair jñānaiś ca
    viluptavibhavas tathārūpam ātmānaṃ na vimraṣṭuṃ kṣama ityarthaḥ* adhunā paśuḥ
    saṃkucitadṛkśaktibādhyaḥ pāśyaś cetyetad vibhajati]
