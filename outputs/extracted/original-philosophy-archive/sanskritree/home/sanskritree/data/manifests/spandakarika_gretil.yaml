  sanskrit: vāśabdaḥ prathamaniḥṣyandoktanimīlanasamādhiprakāraṃ vikalpayan asyāḥ
    samāpatter durlabhatāṃ dhvanayati tenāyamarthaḥ īdṛśī tāvatsaṃvittiḥ durlabhā
    yasya kasyacid evāpaścimajanmano bhavati so 'khilaṃ jagatkrīḍātvena paśyan nijasaṃvidunmeṣanimeṣābhyāṃ
    sṛjan saṃharaṃś ca / mayyāveśya mano ye māṃ nityayuktā upāsate iti sthityā satatasamāviṣṭo
    mahāyogī jīvann eva prāṇādimān api vijñānāgninirdagdhāśeṣabandhano dehapāte tu
    śiva eva jīvaṃścedṛṅmukta eva na tu kathaṃcid api baddhaḥ * na saṃśayaḥ ityanena
    idaṃ dhvanayati dīkṣādinā gurupratyayato muktiḥ īdṛśāt tu jñānāt samācārādvā svapratyayata
    eveti * iyameva mahāsamāpattiḥ sādhakācāryādīnām abhīṣṭaprāptihetuḥ iti ślokadvayenāha]
