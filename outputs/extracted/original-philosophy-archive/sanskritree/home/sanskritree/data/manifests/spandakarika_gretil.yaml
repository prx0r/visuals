- id: spk.comm.4.1.39
  chapter: '4'
  type: commentary
  transliteration: IAST
  critical_status: gretil_import_commentary
  sanskrit: tāmasāmānyāṃ bhagavatīṃ guruṃ śaivī mukham ihocyate iti sthityā śivadhāmaprāptihetutvād
    ācāryarūpām * atha ca guruṃ paśyantyādikroḍīkārāt mahatīṃ bhāratīṃ parāṃ vācam
    tathā guror ācāryasya sambandhinīm upadeṣṭrīṃ giraṃ citrāṃ lokottaracamatkārarūpāṃ
    vande sarvotkṛṣṭatvena samāviśāmi * atha ca sarvāvasthāsu sphuradrūpatvād abhivadantīm
    udyantṛtāprayatnenābhivādaye svarūpavimarśaniṣṭhāṃ tāṃ samāveṣṭuṃ saṃmukhīkaromi
    kīdṛśīm agādho duruttaro yaḥ saṃśayaḥ pūrṇāhaṃtāniścayābhāvātmā vicitraḥ śaṅkākalaṅkaḥ
    sa eva vitatatvenāmbhodhis tasya samyaguttaraṇe yā tāriṇī naur iva tām ityubhayatrāpi
    yojyam / tathā vicitrārthāni nānācamatkāraprayojanāni padāni viśrāntayo yasyāṃ
    parasyāṃ vāci tāṃ vicitrāṇi ramyaracanānupraviṣṭāni arthapadāni vācyavācakāni
    yasyāṃ guruvāci tām prasiddhaprabhāvasvanāmodīraṇāt sambhāvanāpratyayenārthinaḥ
    pravartayan gūhanīyatayā mahāphalatām asya śāstrasya nirūpayati śāstrakāraḥ]
