- id: spk.comm.3.15.35
  chapter: '3'
  type: commentary
  transliteration: IAST
  critical_status: gretil_import_commentary
  sanskrit: caḥ śaṅkāṃ dyotayan tatparihārarūpaṃ prameyāntaraṃ samuccinoti * asya
    paśoḥ svasya śivātmano rūpasyāvaraṇe bhittibhūtatvena prathamānasyāpi samyagaparāmarśane
    tannimittaṃ vyākhyātarūpāḥ śaktayaḥ satatam utthitāḥ yāvaddhi parāmṛtarasātmakasvasvarūpapratyabhijñānam
    asya na vṛttaṃ tāvad etāḥ svasvarūpāvaraṇāyodyacchantyeva yato'sya yaḥ pratyayodbhavo
    vikalpakāvikalpakajñānaprasaraḥ sa śabdānuvedhena ahamidaṃ jānāmi ityādinā sūkṣmāntaḥśabdānurañjanena
    sthūlābhilāpasaṃsargeṇa ca vinā na bhavati iti tiraścām apyasāṃketikaḥ nirdeśaprakhyaḥ
    svātmani ca śironirdeśaprakhyo 'ntarabhyupagamarūpaḥ śabdanavimarśo 'styeva anyathā
    bālasya prathamasaṃketagrahaṇaṃ na ghaṭeta antarūhāpohātmakavimarśaśūnyatvāt /
    sthūlaśabdānuvedhamayas tu vikalpaḥ sarvasya svānubhavasiddhaḥ ślokatrayoktam
    artham upasaṃharanniyataḥ prameyasya sāmānyaspandatattvādabhinnatāṃ prāguktām
    anubadhnan tatpratyabhijñānāpratyabhijñānamayau bandhamokṣau iti lakṣayati]
