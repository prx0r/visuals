  sanskrit: suprabuddhasya bhūmnā jñānajñeyasvarūpayā madhyame pade jñānāgraparyantayos
    tu svasvarūpayaiva spandatattvātmanā parāśaktyā yukto vibhuḥ śaṃkarātmā svabhāvo
    jāgarāsvapnarūpe padadvaye bhāti * tatra hi viśvamasau sadāśiveśvaravatsvāṅgavat
    paśyati tadanyatra tu suṣupte na tu yathānye suṣuptaturyayor iti tripadāvyabhicāriṇī
    iti prakrānte turyasyāprastutatvāt tadupalabdher eva ca turyarūpatvāt asau vibhuś
    cinmaya evāsya bhāti aśeṣavedyopaśamād ity etat suprabuddhābhiprāyam eva na tu
    vastuvṛttānusāreṇa tadanyatra tu cinmayaḥ ity asyānupapannatvāpatteḥ loke sauṣuptasya
    mohamayatvāt śivāpekṣayā tu jāgratsvapnayorapi cinmayatvāt evamapi ca prakṛtānupayuktatvāt
    * itaḥ prabhṛti prathamaniḥṣyandānto granthaḥ prabuddhasya suprabuddhatāyai sthito
    yathā ṭīkākārairna cetitas tathā parīkṣyatāṃ svayameva kiyatpratipadaṃ likhāmaḥ
    * yatheyaṃ jāgarādimadhyadaśāpi prabuddhaṃ na pratibadhnāti tathopapādayati]
