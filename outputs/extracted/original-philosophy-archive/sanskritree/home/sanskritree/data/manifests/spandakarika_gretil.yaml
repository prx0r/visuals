- id: spk.comm.3.16.36
  chapter: '3'
  type: commentary
  transliteration: IAST
  critical_status: gretil_import_commentary
  sanskrit: seti ślokatrayanirṇītatvāt iyamiti prameyaparyantena rūpeṇa sphurantī
    svasvabhāvarūpasya cidātmanaḥ śivasya sambandhinī spandatattvātmikā parābhaṭṭārikaiva
    viśvavaicitryāvasthitikāritvāt kriyāśaktiḥ prāṅnirṇītadṛśā śiva eva gṛhītapaśubhūmike
    vartamānā prāṇapuryaṣṭakarūpam amuṃ kartṛtātmanāhaṃtāvipruṣā prokṣitaṃ kurvāṇā
    tathārūpeṇāpratyabhijñāya svarūpāvārakatvād dhānādānādiparikleśahetutvācca bandhayitrī
    bhavati yadā tu svasya śivātmano rūpasya yo mārgaḥ / śaktyavasthāṃ praviṣṭasya
    nirvibhāgena bhāvanā / tadāsau śivarūpī syācchaivī mukham ihocyate iti śrīvijñānabhaṭṭārakoktanītyā
    prāptyupāyaḥ parāśaktistadātmatayāsau kriyāśaktirjñāyate yoginā yadā vā vikalpakāvikalpakaprasare
    'pi śivasvarūpasya svātmano 'ṃśabhūtam evāśeṣavedyam anenekṣyate tadāsyāsau parānandamayīṃ
    parāṃ siddhim upapādayati]
