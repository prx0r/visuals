- id: spk.comm.1.3.2
  chapter: '1'
  type: commentary
  transliteration: IAST
  critical_status: gretil_import_commentary
  sanskrit: jāgarāparaparyāyo jāgracchabdaḥ śiṣṭaprayuktatvāt * lokaprasiddhe jāgratsvapnasuṣuptānāṃ
    bhede yogiprasiddhe 'pi vā dhāraṇādhyānasamādhirūpe prasarpati anyānyarūpe pravahati
    sati arthāt tattattvaṃ nijādanapāyinaḥ sarvasyātmabhūtāc cānubhavitṛrūpāt svabhāvān
    naiva nivartate * yadihisvayaṃnivarteta taj jāgradādy api tatprakāśavinākṛtaṃ
    na kiṃcitprakāśeta * upalabdhṛtā caitadīyā jāgarāsvapnayoḥ sarvasya svasaṃvedanasiddhā
    sauṣupte yadyapi sā tathā na cetyate tathāpy auttarakālikasmṛtyanyathānupapattyā
    siddhā upalabdhṛta eva ca svabhāvān na nivartate upalabhyaṃ tv avasthādi tanmāhātmyān
    nivartatāṃ kāmaṃ kātra kṣatiḥ * evakāro'pyarthe bhinnakramas tadabhāve'pi na nivartata
    ityarthaḥ * jāgarādivibhedasya viśeṣaṇadvāreṇa hetustadabhinne iti tasmāc chivasvabhāvādabhedena
    prakāśamānatvāt prakāśarūpe ityarthaḥ * yac ca yadekātmakaṃ tatkathaṃ tannivṛttāv
    avatiṣṭhate * yadvā taditi kartṛpadam * abhinna iti tu kevalamabhinnatvaṃ jāgarādeḥ
    śivāpekṣameva * arthāttattattvaṃ jāgarādibhede'pi sati prasarpati prasarati vaicitryaṃ
    gṛhṇāti tan naiva svabhāvān nivartata iti yojyam * kiṃcāyaṃ jāgradādibhedaḥ pariṇāmo
    vivarto veti yat sāṃkhyapāñcarātraśābdikādayo manyante tadvyudāsāyāpyuktaṃ tadabhinna
    iti * avasthāprapañco'pi yadi cinmātrāt manāgapy atiricyeta cidrūpaṃ vā tatpariṇatau
    manāg atiricyeta tan na kiṃcic ca kā syād iti tāvan na pariṇāmo'sti yathoktam
    / pariṇāmo'cetanasya cetanasya na yujyate iti śrīkiraṇe * na ca bhāsamāno 'sāv
    asatyo brahmatattvasyāpi tathātvāpatteḥ ity asatyavibhaktānyarūpopagrāhitā vivarta
    ityapi na saṃgatam * anena cātidurghaṭakiratvam eva bhagavato dhvanitam * yasmāj
    jāgarādivibhedaṃ ca prakāśayati tatraiva ca svābhedamiti bhedātmanā tadabhedātmanobhayātmanā
    ca rūpeṇāparāparāparāparāśaktitrayasvarūpeṇa sphuratīty anuttaraṣaḍardhatattvātmatayā
    bhagavān eva sphurati * ataścajāgarādidaśāvasthito 'pi evamimaṃ svasvabhāvaṃ pariśīlayan
    yaścinute sa śaṃkara evetyupadiṣṭaṃ bhavati * atha ye ekamevedaṃ saṃvidrūpaṃ harṣaviṣādādyanekākāravivartaṃ
    paśyāma ityuktyā jñānasaṃtāna eva tattvamiti saugatā manyante ye cāhaṃpratītipratyeyaḥ
    sadaiva sukhādyupadhitiraskṛta ātmeti mīmāṃsakāḥ pratipannās tānekenaiva ślokenāpavadati]
