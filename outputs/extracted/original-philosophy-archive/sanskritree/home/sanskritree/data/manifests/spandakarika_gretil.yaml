  sanskrit: mnā sarvakeśānāmāspadaṃ tataśca dehe yā glāniḥ arthāddehābhimāninaḥ puṃso
    yo harṣakṣayo'sau viluṇṭhikā parasaṃviddraviṇāpahāreṇa pārimityadaurgatyapradā
    tasyāśca glāner ajñānataś cidānandaghanasvasvarūpāpratyabhijñānāt sṛtir udbhavo
    'vasthitiśca * tadajñānaṃ pradarśayiṣyamāṇasvarūpeṇonmeṣarūpeṇa cedviluptaṃ nikṛttaṃ
    tadāsau glānirajñānātmano hetorabhāvāt kutaḥ syānna bhaved ityarthaḥ * glānyabhāve
    ca dehe 'vaśyambhāvinyo vyādhyādisaṃtāpāvasthā api yathā yathā yogino 'pakṛṣyante
    tathā tathā hemna ivātitāpyamānasya kālikāpagame svasvarūpaṃ dedīpyata eva * evaṃ
    ca dehāvasthitasyāpi sarvadā glānyabhāva eva parayogino vibhūtiḥ yathoktaṃ paramayoginyā
    madālasayā bāladārakān prayogīkurvatyā / tvaṃ kañcuke śīryamāṇe nije'smin dehe
    heye mūḍhatāṃ mā vrajethāḥ / śubhāśubhaiḥ karmabhir dehametanmadādibhiḥ kañcukaste
    nibaddhaḥ iti mitasiddhyabhilāṣiṇo yoginaḥ samāveśābhyāsarasena dehaṃ vidhyato
    valīpalitādivyādhijayo bhavatītyapi bhaṅgyānena pratipāditam * atha yo 'yam unmeṣaḥ
