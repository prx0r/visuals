    critical_status: edition_derived_transliteration_unreviewed
    source_page: PDF 327; printed p. 309, Appendix 3
    sanskrit: 'Labhate tatprayatnena pariksyam tattvam adarat / Yatah svatantrata tasya sarvatreyam akrtrima // 7'
