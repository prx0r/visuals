    critical_status: edition_derived_transliteration_unreviewed
    source_page: PDF 327; printed p. 309, Appendix 3
    sanskrit: "Yatra sthitam idam sarvam karyam yasmacca nirgatam / Tasyanavrtarupatvan na nirodho' sti kutracit // 2"
  - id: spk.003
