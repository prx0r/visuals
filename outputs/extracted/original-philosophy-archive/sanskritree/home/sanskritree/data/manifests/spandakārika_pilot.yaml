    transliteration: Roman ASCII transliteration
    critical_status: edition_derived_transliteration_unreviewed
    source_page: PDF 327; printed p. 309, Appendix 3
    sanskrit: "Aham sukhi ca duhkhi ca raktasca ityadisamvidah / sukhadyavasthanusyute vartante 'nyatra tah sphutam // 4"
  - id: spk.005
