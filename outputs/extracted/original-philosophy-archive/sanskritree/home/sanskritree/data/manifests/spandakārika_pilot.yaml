    critical_status: edition_derived_transliteration_unreviewed
    source_page: PDF 327; printed p. 309, Appendix 3
    sanskrit: "Jagradadivibhede'pi tadabhinne prasarpati / Nivartate nijannaiva svabhavadupalabdhrtah // 3"
  - id: spk.004
